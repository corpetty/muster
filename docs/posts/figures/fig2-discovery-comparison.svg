<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 434" width="880" height="434" font-family="'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>Discovery with a directory, and without one</title>
  <desc>With a directory, adding a contact is a request to a server that learns the edge and keeps it. Without one, the address travels out of band and no third party is involved in the introduction.</desc>

  <rect width="880" height="434" fill="#E4E6E0"/>

  <text x="40" y="46" font-size="19" font-weight="600" fill="#1A1F1C" letter-spacing="-0.3">Two ways to meet</text>
  <text x="40" y="70" font-size="13.5" fill="#656E66">The difference is not encryption. It is whether a lookup happens at all.</text>

  <line x1="440" y1="96" x2="440" y2="350" stroke="#C6CBC3" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- ── LEFT: with a directory ─────────────────────────────── -->
  <text x="40" y="124" font-size="10.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#656E66">CONVENTIONAL</text>
  <text x="40" y="148" font-size="15.5" font-weight="600" fill="#1A1F1C">“Add contact”</text>

  <!-- actors -->
  <circle cx="80" cy="216" r="22" fill="#4B33C4"/>
  <text x="80" y="222" font-size="13" font-weight="500" fill="#E4E6E0" text-anchor="middle">A</text>
  <text x="80" y="256" font-size="11.5" fill="#656E66" text-anchor="middle">you</text>

  <circle cx="370" cy="216" r="22" fill="#4B33C4"/>
  <text x="370" y="222" font-size="13" font-weight="500" fill="#E4E6E0" text-anchor="middle">B</text>
  <text x="370" y="256" font-size="11.5" fill="#656E66" text-anchor="middle">them</text>

  <!-- the server -->
  <rect x="180" y="156" width="90" height="52" rx="8" fill="#23282A"/>
  <text x="225" y="180" font-size="11.5" fill="#DCE2DE" text-anchor="middle">directory</text>
  <text x="225" y="197" font-size="10.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#8FA3F5" text-anchor="middle">logs it</text>

  <!-- arrows through the server -->
  <path d="M104 210 L176 190" stroke="#A32D1E" stroke-width="1.6" fill="none" marker-end="url(#red)"/>
  <path d="M274 190 L346 210" stroke="#A32D1E" stroke-width="1.6" fill="none" marker-end="url(#red)"/>

  <rect x="40" y="286" width="360" height="58" rx="8" fill="#F6E3DF" stroke="#A32D1E" stroke-width="1"/>
  <text x="56" y="308" font-size="10.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#A32D1E">WHAT THE SERVER KEEPS</text>
  <text x="56" y="330" font-size="12.5" fill="#1A1F1C">that A and B know each other, and when they met</text>

  <!-- ── RIGHT: no directory ────────────────────────────────── -->
  <text x="480" y="124" font-size="10.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#656E66">MUSTER</text>
  <text x="480" y="148" font-size="15.5" font-weight="600" fill="#1A1F1C">Paste an address</text>

  <circle cx="520" cy="216" r="22" fill="#4B33C4"/>
  <text x="520" y="222" font-size="13" font-weight="500" fill="#E4E6E0" text-anchor="middle">A</text>
  <text x="520" y="256" font-size="11.5" fill="#656E66" text-anchor="middle">you</text>

  <circle cx="810" cy="216" r="22" fill="#4B33C4"/>
  <text x="810" y="222" font-size="13" font-weight="500" fill="#E4E6E0" text-anchor="middle">B</text>
  <text x="810" y="256" font-size="11.5" fill="#656E66" text-anchor="middle">them</text>

  <!-- direct, out of band -->
  <path d="M546 208 L784 208" stroke="#1E6B52" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#green)"/>
  <text x="665" y="196" font-size="11.5" fill="#1E6B52" text-anchor="middle">out of band — QR, Signal, a table</text>

  <rect x="480" y="286" width="360" height="58" rx="8" fill="#DFEDE6" stroke="#1E6B52" stroke-width="1"/>
  <text x="496" y="308" font-size="10.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#1E6B52">WHAT ANY SERVER KEEPS</text>
  <text x="496" y="330" font-size="12.5" fill="#1A1F1C">nothing — no lookup happened</text>

  <!-- honest caveat -->
  <line x1="40" y1="368" x2="840" y2="368" stroke="#C6CBC3" stroke-width="1"/>
  <text x="40" y="392" font-size="12.5" fill="#1A1F1C">The right-hand column is not free of observers — it moves them.</text>
  <text x="40" y="412" font-size="12" fill="#656E66">The channel that carried the address is unauthenticated, and a relay still sees which topics a client subscribes to.</text>

  <defs>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#A32D1E"/>
    </marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1E6B52"/>
    </marker>
  </defs>
</svg>
