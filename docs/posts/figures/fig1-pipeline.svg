<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 524" width="880" height="524" font-family="'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>The transaction pipeline: seven stages, and where privacy argument actually lands</title>
  <desc>Discovery, diligence, negotiation and contracting leak intent before a transaction exists. Ordering, settlement and enforcement involve the chain. Privacy discourse concentrates almost entirely on settlement.</desc>

  <rect width="880" height="524" fill="#E4E6E0"/>

  <text x="40" y="46" font-size="19" font-weight="600" fill="#1A1F1C" letter-spacing="-0.3">Seven stages. The chain is in three. The argument is about one.</text>
  <text x="40" y="70" font-size="13.5" fill="#656E66">What leaks at each stage of a transaction, and who is positioned to see it</text>

  <!-- group brackets -->
  <path d="M40 128 L40 118 L472 118 L472 128" fill="none" stroke="#4B33C4" stroke-width="1.2"/>
  <text x="256" y="108" font-size="12.5" fill="#4B33C4" text-anchor="middle">before a transaction exists — leaks <tspan font-style="italic">intent</tspan></text>

  <path d="M488 128 L488 118 L840 118 L840 128" fill="none" stroke="#1A1F1C" stroke-width="1.2"/>
  <text x="664" y="108" font-size="12.5" font-weight="600" fill="#1A1F1C" text-anchor="middle">the chain is here</text>

  <!-- ── stage columns ─────────────────────────────────────── -->
  <g>
    <!-- 1 Discovery -->
    <rect x="40" y="140" width="102" height="196" rx="8" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1"/>
    <text x="52" y="162" font-size="9.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#656E66">01</text>
    <text x="52" y="182" font-size="13" font-weight="600" fill="#1A1F1C">Discovery</text>
    <text x="52" y="208" font-size="11" fill="#1A1F1C">counterparties,</text>
    <text x="52" y="224" font-size="11" fill="#1A1F1C">intent</text>
    <text x="52" y="250" font-size="10.5" fill="#656E66">public frontends,</text>
    <text x="52" y="265" font-size="10.5" fill="#656E66">Telegram, order</text>
    <text x="52" y="280" font-size="10.5" fill="#656E66">books</text>

    <!-- 2 Diligence -->
    <rect x="152" y="140" width="102" height="196" rx="8" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1"/>
    <text x="164" y="162" font-size="9.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#656E66">02</text>
    <text x="164" y="182" font-size="13" font-weight="600" fill="#1A1F1C">Diligence</text>
    <text x="164" y="208" font-size="11" fill="#1A1F1C">address history,</text>
    <text x="164" y="224" font-size="11" fill="#1A1F1C">identity graph</text>
    <text x="164" y="250" font-size="10.5" fill="#656E66">chain surveillance</text>
    <text x="164" y="265" font-size="10.5" fill="#656E66">firms, explorers</text>

    <!-- 3 Negotiation -->
    <rect x="264" y="140" width="102" height="196" rx="8" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1"/>
    <text x="276" y="162" font-size="9.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#656E66">03</text>
    <text x="276" y="182" font-size="13" font-weight="600" fill="#1A1F1C">Negotiation</text>
    <text x="276" y="208" font-size="11" fill="#1A1F1C">size, terms,</text>
    <text x="276" y="224" font-size="11" fill="#1A1F1C">reservation price</text>
    <text x="276" y="250" font-size="10.5" fill="#656E66">RPCs, quote infra,</text>
    <text x="276" y="265" font-size="10.5" fill="#656E66">operators</text>

    <!-- 4 Contracting -->
    <rect x="376" y="140" width="96" height="196" rx="8" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1"/>
    <text x="388" y="162" font-size="9.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#656E66">04</text>
    <text x="388" y="182" font-size="13" font-weight="600" fill="#1A1F1C">Contracting</text>
    <text x="388" y="208" font-size="11" fill="#1A1F1C">frontend and</text>
    <text x="388" y="224" font-size="11" fill="#1A1F1C">signing context</text>
    <text x="388" y="250" font-size="10.5" fill="#656E66">web frontends,</text>
    <text x="388" y="265" font-size="10.5" fill="#656E66">blind signing</text>

    <!-- 5 Ordering -->
    <rect x="488" y="140" width="102" height="196" rx="8" fill="#23282A"/>
    <text x="500" y="162" font-size="9.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#96A19B">05</text>
    <text x="500" y="182" font-size="13" font-weight="600" fill="#DCE2DE">Ordering</text>
    <text x="500" y="208" font-size="11" fill="#DCE2DE">pending order</text>
    <text x="500" y="224" font-size="11" fill="#DCE2DE">flow</text>
    <text x="500" y="250" font-size="10.5" fill="#96A19B">mempool, MEV,</text>
    <text x="500" y="265" font-size="10.5" fill="#96A19B">your IP</text>

    <!-- 6 Settlement -->
    <rect x="600" y="140" width="102" height="196" rx="8" fill="#23282A" stroke="#8FA3F5" stroke-width="1.6"/>
    <text x="612" y="162" font-size="9.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#96A19B">06</text>
    <text x="612" y="182" font-size="13" font-weight="600" fill="#DCE2DE">Settlement</text>
    <text x="612" y="208" font-size="11" fill="#DCE2DE">balances,</text>
    <text x="612" y="224" font-size="11" fill="#DCE2DE">approvals</text>
    <text x="612" y="250" font-size="10.5" fill="#96A19B">the public record,</text>
    <text x="612" y="265" font-size="10.5" fill="#96A19B">forever</text>

    <!-- 7 Enforcement -->
    <rect x="712" y="140" width="128" height="196" rx="8" fill="#23282A"/>
    <text x="724" y="162" font-size="9.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#96A19B">07</text>
    <text x="724" y="182" font-size="13" font-weight="600" fill="#DCE2DE">Enforcement</text>
    <text x="724" y="208" font-size="11" fill="#DCE2DE">identifiable</text>
    <text x="724" y="224" font-size="11" fill="#DCE2DE">operators</text>
    <text x="724" y="250" font-size="10.5" fill="#96A19B">can a block producer</text>
    <text x="724" y="265" font-size="10.5" fill="#96A19B">be found and coerced?</text>
  </g>

  <!-- where the argument is -->
  <path d="M651 348 L651 366" fill="none" stroke="#8FA3F5" stroke-width="1.6"/>
  <circle cx="651" cy="372" r="5" fill="#8FA3F5"/>
  <text x="651" y="394" font-size="12.5" font-weight="600" fill="#1A1F1C" text-anchor="middle">privacy argument lives here</text>
  <text x="651" y="412" font-size="11.5" fill="#656E66" text-anchor="middle">shielded amounts, mixers, stealth addresses</text>

  <line x1="40" y1="436" x2="840" y2="436" stroke="#C6CBC3" stroke-width="1"/>

  <text x="40" y="460" font-size="12.5" fill="#4B33C4">Four of seven stages happen before a transaction exists.</text>
  <text x="40" y="478" font-size="11.5" fill="#656E66">Everything an observer learns there is about intent, not value — and almost none of it is argued about.</text>
  <text x="40" y="502" font-size="11.5" fill="#656E66">Stage names and leak descriptions from the PriFi competitor matrix cross-check. Rated <tspan font-weight="600" fill="#1A1F1C">default vs opt-in</tspan> and <tspan font-weight="600" fill="#1A1F1C">shipped vs roadmap</tspan>, strictly.</text>
</svg>
