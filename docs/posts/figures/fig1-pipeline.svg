<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>The transaction pipeline: four stages, and where the chain touches it</title>
  <desc>Discovery, diligence and negotiation leak intent to platforms, directories and hosts. Settlement, the only stage a blockchain touches, leaks value to a public ledger.</desc>

  <rect width="880" height="470" fill="#E4E6E0"/>

  <text x="40" y="46" font-size="19" font-weight="600" fill="#1A1F1C" letter-spacing="-0.3">Four stages. The chain is in one of them.</text>
  <text x="40" y="70" font-size="13.5" fill="#656E66">What an observer learns at each step — and who the observer is</text>

  <!-- brace over stages 1-3 -->
  <path d="M112 128 L112 120 L642 120 L642 128" fill="none" stroke="#656E66" stroke-width="1"/>
  <text x="377" y="110" font-size="12.5" fill="#656E66" text-anchor="middle">these three leak <tspan font-style="italic">intent</tspan> — and are barely examined</text>

  <!-- the chain marker -->
  <path d="M761 128 L761 120 L840 120 L840 128" fill="none" stroke="#1A1F1C" stroke-width="1.5"/>
  <text x="800" y="110" font-size="12.5" font-weight="600" fill="#1A1F1C" text-anchor="middle">the chain</text>

  <line x1="40" y1="182" x2="840" y2="182" stroke="#C6CBC3" stroke-width="1"/>

  <g font-size="13.5">
    <!-- 1. Discovery -->
    <g>
      <circle cx="140" cy="182" r="7" fill="#4B33C4"/>
      <text x="112" y="160" font-size="10.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#656E66">STAGE 1</text>
      <text x="112" y="216" font-size="15" font-weight="600" fill="#1A1F1C">Discovery</text>
      <text x="112" y="238" fill="#656E66">How do you find</text>
      <text x="112" y="256" fill="#656E66">each other?</text>
      <rect x="112" y="276" width="150" height="98" rx="8" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1"/>
      <text x="126" y="298" font-size="10.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#4B33C4">LEAKS</text>
      <text x="126" y="320" font-size="12.5" fill="#1A1F1C">who you considered</text>
      <text x="126" y="338" font-size="12.5" fill="#1A1F1C">dealing with</text>
      <text x="126" y="362" font-size="11.5" fill="#656E66">to a directory</text>
    </g>

    <!-- 2. Diligence -->
    <g>
      <circle cx="330" cy="182" r="7" fill="#4B33C4"/>
      <text x="302" y="160" font-size="10.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#656E66">STAGE 2</text>
      <text x="302" y="216" font-size="15" font-weight="600" fill="#1A1F1C">Diligence</text>
      <text x="302" y="238" fill="#656E66">Are they who they</text>
      <text x="302" y="256" fill="#656E66">claim to be?</text>
      <rect x="302" y="276" width="150" height="98" rx="8" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1"/>
      <text x="316" y="298" font-size="10.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#4B33C4">LEAKS</text>
      <text x="316" y="320" font-size="12.5" fill="#1A1F1C">what you checked,</text>
      <text x="316" y="338" font-size="12.5" fill="#1A1F1C">and about whom</text>
      <text x="316" y="362" font-size="11.5" fill="#656E66">to an explorer, a KYC</text>
    </g>

    <!-- 3. Negotiation -->
    <g>
      <circle cx="520" cy="182" r="7" fill="#4B33C4"/>
      <text x="492" y="160" font-size="10.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#656E66">STAGE 3</text>
      <text x="492" y="216" font-size="15" font-weight="600" fill="#1A1F1C">Negotiation</text>
      <text x="492" y="238" fill="#656E66">What are the</text>
      <text x="492" y="256" fill="#656E66">terms?</text>
      <rect x="492" y="276" width="150" height="98" rx="8" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1"/>
      <text x="506" y="298" font-size="10.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#4B33C4">LEAKS</text>
      <text x="506" y="320" font-size="12.5" fill="#1A1F1C">what you asked,</text>
      <text x="506" y="338" font-size="12.5" fill="#1A1F1C">rejected, hesitated on</text>
      <text x="506" y="362" font-size="11.5" fill="#656E66">to a chat host</text>
    </g>

    <!-- 4. Settlement -->
    <g>
      <circle cx="710" cy="182" r="7" fill="#1A1F1C"/>
      <text x="682" y="160" font-size="10.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#656E66">STAGE 4</text>
      <text x="682" y="216" font-size="15" font-weight="600" fill="#1A1F1C">Settlement</text>
      <text x="682" y="238" fill="#656E66">How does value</text>
      <text x="682" y="256" fill="#656E66">move?</text>
      <rect x="682" y="276" width="158" height="98" rx="8" fill="#23282A"/>
      <text x="696" y="298" font-size="10.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#8FA3F5">LEAKS</text>
      <text x="696" y="320" font-size="12.5" fill="#DCE2DE">an amount, between</text>
      <text x="696" y="338" font-size="12.5" fill="#DCE2DE">two addresses, at a time</text>
      <text x="696" y="362" font-size="11.5" fill="#96A19B">to everyone, forever</text>
    </g>
  </g>

  <line x1="40" y1="406" x2="840" y2="406" stroke="#C6CBC3" stroke-width="1"/>
  <text x="40" y="432" font-size="13" fill="#1A1F1C">Privacy argument concentrates on stage four. It is roughly a quarter of the problem.</text>
  <text x="40" y="454" font-size="12" fill="#656E66">The pipeline also loops — diligence sends you back to discovery — and its shape differs per use case.</text>
</svg>
