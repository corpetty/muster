<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 528" width="880" height="528" font-family="'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>One wallet, any chain — the settlement seam</title>
  <desc>Settlement is chain-agnostic: the app never becomes the settlement layer. A Wallet aggregate speaks a ChainAdapter seam, and each chain is an adapter behind it — an EVM adapter (ETH + ERC-20, public accounts, over the user's untrusted RPC) and a mock shielded chain modelled on the LEZ (public and shielded accounts, delayed finality). The seam refuses to collapse four divergences: the account model, the asset model, finality latency, and the failure channel. Signing goes through the keystore seam (FS-4); a failed read raises rather than returning a false zero. Both adapters are built and tested; a second chain is a registration, not a rewrite.</desc>
<!-- provenance
     serves:   BOTH
     shows:    A Wallet aggregate over a ChainAdapter seam with two adapters (EVM, mock
               shielded), the four divergences the seam keeps distinct (account model,
               assets, finality, failure), and where signing (FS-4) and the untrusted RPC
               (inv 8) sit.
     sources:  docs/01-furps.md
               docs/02-implementation-plan.md
               CLAUDE.md
     evidence: [from-source] F-Design: settlement chain-agnostic, the app never becomes
                   the settlement layer; invariant 8: untrusted user-configurable RPC
               [from-source] FS-4: key material stays behind the keystore seam; the
                   wallet signs through it, never holding a key
               [measured] both adapters built and tested (wallet_types_test,
                   wallet_mock_test, wallet_evm_test); the hosted wallet_* surface is wired
     recheck:  Re-check when the real LEZ adapter lands (registers behind the same seam)
               or a third chain is added.
-->

  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A928C"/>
    </marker>
  </defs>

  <rect width="880" height="528" fill="#E4E6E0"/>

  <text x="40" y="42" font-size="19" font-weight="600" fill="#1A1F1C" letter-spacing="-0.3">One wallet, any chain</text>
  <text x="40" y="64" font-size="13.5" fill="#656E66">Settlement is chain-agnostic — a chain is an adapter behind a seam, never an assumption the app bakes in.</text>

  <rect x="40" y="80" width="800" height="30" rx="5" fill="#DFEDE6" stroke="#1E6B52" stroke-width="1.2"/>
  <rect x="52" y="88" width="96" height="15" rx="7.5" fill="#1E6B52"/>
  <text x="100" y="99" font-size="8" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.08em" text-anchor="middle" fill="#DFEDE6">BUILT · F-DESIGN</text>
  <text x="160" y="99" font-size="10" fill="#2A4A3C">A ChainAdapter seam with two impls (EVM + a mock shielded chain) — a second chain is a registration, not a rewrite</text>

  <!-- ══ the aggregate ══ -->
  <rect x="260" y="128" width="360" height="52" rx="6" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1.4"/>
  <text x="440" y="150" font-size="12" text-anchor="middle" font-weight="600" fill="#1A1F1C">THE WALLET — chain-agnostic aggregate</text>
  <text x="440" y="168" font-size="10" text-anchor="middle" fill="#3F4742">accounts · balances · estimateFee · send · finality — routes by chain id</text>

  <path d="M 340 180 L 200 214" stroke="#8A928C" stroke-width="1.2" fill="none" marker-end="url(#g)"/>
  <path d="M 540 180 L 680 214" stroke="#8A928C" stroke-width="1.2" fill="none" marker-end="url(#g)"/>
  <text x="440" y="200" font-size="9" text-anchor="middle" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#656E66">ChainAdapter seam · describe() names the chain's rules, never assumed</text>

  <!-- ══ EVM adapter ══ -->
  <rect x="40" y="216" width="380" height="132" rx="6" fill="#DFEDE6" stroke="#1E6B52" stroke-width="1.2"/>
  <text x="56" y="238" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#1E6B52">EVM ADAPTER · built</text>
  <text x="56" y="260" font-size="11.5" font-weight="600" fill="#1A1F1C">ETH + ERC-20 over the user's RPC</text>
  <text x="56" y="280" font-size="10" fill="#3F4742">Accounts: one public address.</text>
  <text x="56" y="296" font-size="10" fill="#3F4742">Finality: immediate (anvil) / probabilistic.</text>
  <text x="56" y="312" font-size="10" fill="#3F4742">Reads via nim-web3; balances can be verified</text>
  <text x="56" y="326" font-size="10" fill="#3F4742">against a state root (see mech-verified-reads).</text>
  <text x="56" y="342" font-size="9.5" fill="#1E6B52">The chain the Safe settles on.</text>

  <!-- ══ mock shielded adapter ══ -->
  <rect x="460" y="216" width="380" height="132" rx="6" fill="#DFEDE6" stroke="#1E6B52" stroke-width="1.2"/>
  <text x="476" y="238" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#1E6B52">MOCK SHIELDED CHAIN · built (LEZ-modelled)</text>
  <text x="476" y="260" font-size="11.5" font-weight="600" fill="#1A1F1C">Deliberately unlike EVM</text>
  <text x="476" y="280" font-size="10" fill="#3F4742">Accounts: a public id AND a shielded key-set.</text>
  <text x="476" y="296" font-size="10" fill="#3F4742">Finality: delayed — debit now, recipient</text>
  <text x="476" y="310" font-size="10" fill="#3F4742">credited on settlement (the stale-read trap).</text>
  <text x="476" y="326" font-size="10" fill="#3F4742">Failure by sentinel, translated to a raise.</text>
  <text x="476" y="342" font-size="9.5" fill="#1E6B52">Proves the seam is generic, no infra.</text>

  <!-- ══ the four divergences ══ -->
  <rect x="40" y="360" width="800" height="60" rx="6" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1.2"/>
  <text x="56" y="382" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#656E66">THE FOUR DIVERGENCES THE SEAM REFUSES TO COLLAPSE</text>
  <text x="56" y="404" font-size="11" fill="#1A1F1C"><tspan font-weight="600">Account model</tspan> (address vs shielded key-set) · <tspan font-weight="600">Assets</tspan> (native + tokens, amounts &gt; 64 bits) · <tspan font-weight="600">Finality</tspan> (immediate vs minutes) · <tspan font-weight="600">Failure</tspan></text>
  <text x="56" y="414" font-size="9.5" fill="#656E66"> </text>

  <!-- ══ seam obligations ══ -->
  <rect x="40" y="430" width="390" height="42" rx="6" fill="#23282A"/>
  <text x="56" y="450" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#96A19B">SIGNING — FS-4</text>
  <text x="56" y="466" font-size="10.5" fill="#DCE2DE">Every send signs through the keystore seam; the key never leaves it.</text>

  <rect x="450" y="430" width="390" height="42" rx="6" fill="#23282A"/>
  <text x="466" y="450" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#96A19B">READS — INVARIANT 8</text>
  <text x="466" y="466" font-size="10.5" fill="#DCE2DE">The RPC is untrusted; a failed read raises, never a false zero.</text>

  <text x="40" y="500" font-size="10.5" font-weight="600" fill="#1E6B52">The real LEZ adapter (shielded proofs, minutes-long settlement) is the same registration — a chain the wallet gains, not a rewrite it needs.</text>
  <text x="40" y="516" font-size="10.5" fill="#3F4742">A balance carries its grade: <tspan font-weight="600" fill="#1E6B52">verified-locally</tspan> when checked against consensus, <tspan font-weight="600">attested</tspan> when it is only what the RPC said.</text>
</svg>
