<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 612" width="880" height="612" font-family="'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>Why a shielded payment arrives somewhere the recipient is not looking</title>
  <desc>A private account id derives from a viewing key and an identifier. The keys a recipient publishes carry no identifier, so the sender's client picks one at random and the note lands at an account neither party can predict. The money is not lost; polling the address you published is what fails.</desc>
<!-- provenance
     serves:   POST
     shows:    The account-id derivation drawn: id is a function of a viewing key and an
               identifier, the published keys carry no identifier, so the sender's client
               picks one at random and the note lands where nobody is looking. Plus the
               workaround and its two disclosed costs.
     sources:  demo/poc/BUG-private-transfer-recipient-identifier.md
               demo/GAPS.md
     evidence: [measured] Reproduced twice — two peers over the testnet and a single-
                   process standalone reproducer. The two account ids and their balances are
                   the observed values
               [from-source] The derivation from (viewing key, identifier) and the random
                   choice are read off wallet_ffi and lez_core, whose own comment states the
                   random pick
     recheck:  When the upstream issue is fixed. At that point the workaround comes out
               of the build and this figure becomes history rather than a caveat — which
               is worth drawing the difference between.
-->

  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A32D1E"/>
    </marker>
  </defs>

  <rect width="880" height="612" fill="#E4E6E0"/>

  <text x="40" y="42" font-size="19" font-weight="600" fill="#1A1F1C" letter-spacing="-0.3">A leak nobody chose, drawn</text>
  <text x="40" y="64" font-size="13.5" fill="#656E66">The payment succeeds. The sender is debited. The recipient's balance never moves — and the money is not lost.</text>

  <!-- ══════════ THE DERIVATION ══════════ -->
  <rect x="40" y="88" width="800" height="122" rx="6" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="56" y="110" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#656E66">HOW A PRIVATE ACCOUNT ID IS DERIVED</text>

  <text x="56" y="146" font-size="13" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">private account id  =  f (</text>
  <rect x="266" y="129" width="104" height="24" rx="4" fill="#DFEDE6" stroke="#1E6B52" stroke-width="1.2"/>
  <text x="318" y="146" font-size="12" font-family="'DM Mono',ui-monospace,Menlo,monospace" text-anchor="middle" fill="#1E6B52">viewing key</text>
  <text x="376" y="146" font-size="13" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">,</text>
  <rect x="392" y="129" width="100" height="24" rx="4" fill="#F6E3DF" stroke="#A32D1E" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="442" y="146" font-size="12" font-family="'DM Mono',ui-monospace,Menlo,monospace" text-anchor="middle" fill="#A32D1E">identifier</text>
  <text x="498" y="146" font-size="13" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">)</text>

  <text x="318" y="174" font-size="9.5" text-anchor="middle" fill="#1E6B52" font-weight="600">published with the keys</text>
  <text x="318" y="188" font-size="9" text-anchor="middle" fill="#656E66">the recipient hands these over</text>

  <text x="442" y="174" font-size="9.5" text-anchor="middle" fill="#A32D1E" font-weight="600">carried by nothing</text>
  <text x="442" y="188" font-size="9" text-anchor="middle" fill="#A32D1E">the recipient publishes</text>

  <path d="M 500 160 L 560 160" stroke="#A32D1E" stroke-width="1.4" fill="none" marker-end="url(#d)"/>
  <text x="570" y="152" font-size="10.5" font-weight="600" fill="#A32D1E">So the sender's client picks one at random.</text>
  <text x="570" y="167" font-size="10" fill="#3F4742">The zone's own comment says so. The note lands at an</text>
  <text x="570" y="181" font-size="10" fill="#3F4742">account neither party can predict.</text>

  <!-- ══════════ THE TWO ACCOUNTS ══════════ -->
  <rect x="40" y="226" width="390" height="116" rx="6" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <rect x="40" y="226" width="5" height="116" rx="2.5" fill="#A32D1E"/>
  <text x="62" y="248" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#656E66">THE ACCOUNT THE RECIPIENT MADE</text>
  <text x="62" y="272" font-size="11.5" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">021fbfac…4634</text>
  <text x="200" y="272" font-size="13" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" fill="#A32D1E">balance 0</text>
  <text x="62" y="294" font-size="9.5" fill="#3F4742">Created, registered on-chain — confirmed by transaction</text>
  <text x="62" y="307" font-size="9.5" fill="#3F4742">hash, not by absence of error — advertised, and polled.</text>
  <text x="62" y="326" font-size="9.5" fill="#A32D1E" font-weight="600">Re-read five times, full sync each. It never moved.</text>

  <rect x="450" y="226" width="390" height="116" rx="6" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <rect x="450" y="226" width="5" height="116" rx="2.5" fill="#1E6B52"/>
  <text x="472" y="248" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#656E66">THE ACCOUNT THE MONEY WENT TO</text>
  <text x="472" y="272" font-size="11.5" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">b719ff50…259a</text>
  <text x="610" y="272" font-size="13" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" fill="#1E6B52">balance 10</text>
  <text x="472" y="294" font-size="9.5" fill="#3F4742">Derived from a number nobody chose and nobody has</text>
  <text x="472" y="307" font-size="9.5" fill="#3F4742">seen. It did not exist until the payment created it.</text>
  <text x="472" y="326" font-size="9.5" fill="#1E6B52" font-weight="600">Found by enumerating the wallet after a sync.</text>

  <!-- ══════════ WHAT ACTUALLY FAILED ══════════ -->
  <rect x="40" y="358" width="800" height="88" rx="6" fill="#23282A"/>
  <text x="56" y="380" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#96A19B">WHAT ACTUALLY FAILED</text>
  <text x="56" y="402" font-size="12.5" font-weight="600" fill="#DCE2DE">Not the payment. Not the proof. Not the encryption.</text>
  <text x="56" y="419" font-size="11" fill="#96A19B">The note is discoverable by scanning with the recipient's viewing key, and the account is in <tspan font-family="'DM Mono',ui-monospace,Menlo,monospace">list_accounts</tspan>.</text>
  <text x="56" y="436" font-size="11" font-weight="600" fill="#8FA3F5">What fails is the obvious client behaviour — polling the address you published.</text>

  <!-- ══════════ THE WORKAROUND ══════════ -->
  <rect x="40" y="462" width="800" height="126" rx="6" fill="#F6E3DF" stroke="#A32D1E" stroke-width="1.4"/>
  <text x="56" y="484" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#A32D1E">THE WORKAROUND, AND WHAT IT COSTS — DISCLOSED ON SCREEN, NOT ONLY HERE</text>

  <text x="56" y="506" font-size="11" font-weight="600" fill="#1A1F1C">After syncing, sum every private account the wallet can find; spend from the largest.</text>

  <text x="56" y="528" font-size="10.5" fill="#3F4742"><tspan font-weight="600">The balance is a sum over accounts the user never created.</tspan> The wallet card says so, next to the number, whenever it is true.</text>
  <text x="56" y="544" font-size="10.5" fill="#3F4742"><tspan font-weight="600">A single payment can only draw on one of them</tspan>, so the figure shown may be larger than anything one send can spend.</text>

  <text x="56" y="568" font-size="10.5" font-weight="600" fill="#A32D1E">It is a workaround, not a design, and it comes out the moment a payment arrives at the address it was sent to.</text>
  <text x="56" y="582" font-size="10" fill="#3F4742">Reported upstream with a single-file reproducer that links wallet-ffi directly.</text>
</svg>
