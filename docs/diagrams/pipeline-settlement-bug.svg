<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 676" width="880" height="676" font-family="'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>Privacy costs you the ability to ask about your own address</title>
  <desc>A private account id is a hash over a key node and an identifier. The recipient publishes the key node; the sender picks the identifier, so every payment mints a fresh account that only the recipient's viewing key can find. That buys an absence of reusable identifiers and costs the ability to look up a balance by address. Includes the retraction of our own report of this as a bug.</desc>
<!-- provenance
     serves:   POST
     shows:    The account-id derivation drawn: id = sha256(prefix ‖ npk ‖ vpk ‖
               identifier). The recipient publishes the key node; the sender picks the
               identifier; every payment therefore mints a fresh account found only by
               scanning. What that buys, what it costs, and the retraction of our own
               report of it as a bug.
     sources:  demo/poc/BUG-private-transfer-recipient-identifier.md
               demo/GAPS.md
     evidence: [from-source] The derivation and the key-node model are as stated by the
                   LEZ team on 2026-08-13 in response to our report, and are documented in
                   their token-transfer tutorial
               [measured] The account ids and balances are observed values from a two-
                   peer testnet run and a single-process reproducer. What is NOT evidence is
                   the conclusion originally drawn from them — see the retraction panel
     recheck:  If the zone ever exposes note consolidation or a multi-note spend, the
               cost half of the trade changes. The retraction panel is permanent. Redrawn
               2026-08-13 — the slug is kept deliberately so the figure's own correction
               is visible rather than the wrong version simply disappearing.
-->

  <rect width="880" height="676" fill="#E4E6E0"/>

  <text x="40" y="42" font-size="19" font-weight="600" fill="#1A1F1C" letter-spacing="-0.3">Privacy costs you the ability to ask about your own address</text>
  <text x="40" y="64" font-size="13.5" fill="#656E66">The trade drawn. No identifier anyone can join up — and no account whose balance is the answer.</text>

  <!-- ══════════ THE DERIVATION ══════════ -->
  <rect x="40" y="88" width="800" height="126" rx="6" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="56" y="110" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#656E66">HOW A PRIVATE ACCOUNT ID IS DERIVED</text>

  <text x="56" y="146" font-size="13" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">account id  =  sha256 ( prefix ‖</text>
  <rect x="312" y="129" width="118" height="24" rx="4" fill="#DFEDE6" stroke="#1E6B52" stroke-width="1.2"/>
  <text x="371" y="146" font-size="12" font-family="'DM Mono',ui-monospace,Menlo,monospace" text-anchor="middle" fill="#1E6B52">npk ‖ vpk</text>
  <text x="438" y="146" font-size="13" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">‖</text>
  <rect x="456" y="129" width="112" height="24" rx="4" fill="#F6E3DF" stroke="#A32D1E" stroke-width="1.2"/>
  <text x="512" y="146" font-size="12" font-family="'DM Mono',ui-monospace,Menlo,monospace" text-anchor="middle" fill="#A32D1E">identifier</text>
  <text x="578" y="146" font-size="13" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">)</text>

  <text x="371" y="176" font-size="9.5" text-anchor="middle" fill="#1E6B52" font-weight="600">the key node — what you publish</text>
  <text x="371" y="190" font-size="9" text-anchor="middle" fill="#656E66">one pair, handed to everyone</text>

  <text x="512" y="176" font-size="9.5" text-anchor="middle" fill="#A32D1E" font-weight="600">chosen by the sender</text>
  <text x="512" y="190" font-size="9" text-anchor="middle" fill="#656E66">fresh for every payment</text>

  <text x="620" y="180" font-size="10.5" font-weight="600" fill="#1A1F1C">There is no address here.</text>
  <text x="620" y="195" font-size="10" fill="#3F4742">Only a key, and a number you never see.</text>

  <!-- ══════════ THE TWO SIDES ══════════ -->
  <rect x="40" y="230" width="390" height="130" rx="6" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <rect x="40" y="230" width="5" height="130" rx="2.5" fill="#1E6B52"/>
  <text x="62" y="252" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#656E66">WHAT YOU PUBLISH — ONCE</text>
  <text x="62" y="278" font-size="11.5" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">npk ‖ vpk</text>
  <text x="62" y="300" font-size="9.5" fill="#3F4742">A key pair, not an address. It is the same one you</text>
  <text x="62" y="313" font-size="9.5" fill="#3F4742">give to everybody, and it never appears on the</text>
  <text x="62" y="326" font-size="9.5" fill="#3F4742">public record — not once, not for any payment.</text>
  <text x="62" y="348" font-size="9.5" font-weight="600" fill="#1E6B52">There is nothing here for an observer to join up.</text>

  <rect x="450" y="230" width="390" height="130" rx="6" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <rect x="450" y="230" width="5" height="130" rx="2.5" fill="#1E6B52"/>
  <text x="472" y="252" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#656E66">WHAT ARRIVES — A NEW ACCOUNT EACH TIME</text>
  <text x="472" y="276" font-size="11" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">b719ff50…259a</text>
  <text x="622" y="276" font-size="11" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" fill="#1E6B52">balance 10</text>
  <text x="472" y="294" font-size="11" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">86cb3f64…2f1c</text>
  <text x="622" y="294" font-size="11" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" fill="#1E6B52">balance 10</text>
  <text x="472" y="316" font-size="9.5" fill="#3F4742">Neither existed until the payment created it, at a</text>
  <text x="472" y="329" font-size="9.5" fill="#3F4742">number the sender chose. Only your viewing key finds them.</text>
  <text x="472" y="348" font-size="9.5" font-weight="600" fill="#1E6B52">Your balance is the sum: a scan, not a lookup.</text>

  <!-- ══════════ THE TRADE ══════════ -->
  <rect x="40" y="376" width="800" height="98" rx="6" fill="#23282A"/>
  <text x="56" y="398" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#96A19B">THE TRADE, IN ONE MECHANISM</text>
  <text x="56" y="421" font-size="12.5" font-weight="600" fill="#DCE2DE">You give up the reusable address. That is the whole of it.</text>
  <text x="56" y="441" font-size="11" fill="#96A19B"><tspan font-weight="600" fill="#DCE2DE">Buys:</tspan> no string appears twice, so nothing on the public record ties one payment you received to the next.</text>
  <text x="56" y="461" font-size="11" fill="#8FA3F5"><tspan font-weight="600">Costs:</tspan> no account whose balance is the answer. A shielded wallet is a key and a search, not an address and a lookup.</text>

  <!-- ══════════ THE RETRACTION ══════════ -->
  <rect x="40" y="490" width="800" height="162" rx="6" fill="#F6E3DF" stroke="#A32D1E" stroke-width="1.4"/>
  <text x="56" y="512" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#A32D1E">WE REPORTED THIS AS A BUG IN THE ZONE. THERE ISN'T ONE.</text>

  <text x="56" y="534" font-size="11" font-weight="600" fill="#1A1F1C">We measured it twice — two peers over the testnet, and a standalone single-process reproducer. They agreed.</text>
  <text x="56" y="553" font-size="10.5" fill="#3F4742">Both read <tspan font-family="'DM Mono',ui-monospace,Menlo,monospace">wallet_ffi_resolve_private_account</tspan>, which reports <tspan font-family="'DM Mono',ui-monospace,Menlo,monospace">identifier: 0</tspan> for every account a wallet owns — a defaulted field</text>
  <text x="56" y="568" font-size="10.5" fill="#3F4742">that is never populated. One unverified instrument, read twice, is one measurement.</text>

  <text x="56" y="592" font-size="11.5" font-weight="600" fill="#A32D1E">Reproducing a result establishes that it happens. It establishes nothing whatsoever about why.</text>

  <text x="56" y="614" font-size="10" fill="#3F4742">And the fix we chose did the damage the bug didn't. <tspan font-family="'DM Mono',ui-monospace,Menlo,monospace">register_private_account</tspan> <tspan font-weight="600">initializes</tspan> the account, and the initialization</text>
  <text x="56" y="628" font-size="10" fill="#3F4742">nullifier is a hash of the account id alone — so any id can be foreign-initialized exactly once, ever. Registering our own published</text>
  <text x="56" y="642" font-size="10" fill="#3F4742">account is what made it permanently uncreditable by anyone else.</text>
</svg>
