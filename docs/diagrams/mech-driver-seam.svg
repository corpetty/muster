<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 616" width="880" height="616" font-family="'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>The driver seam: the core never interprets contribution bytes</title>
  <desc>The core routes opaque blobs and asks a driver what they mean. Rounds, serialization domain and finality are described by the driver, never hardcoded, and a shared conformance suite is the contract every driver passes. Specified as F-6, F-7 and S-1; built at P1–P2. The build splits F-6's seven methods three ways: describe, canonicalize and verifyContribution on the Driver (with environment, manifest, profile and the fold hooks), collection progress in the core's Collection, and assemble, submit and watch on the Settlement seam. Twelve driver kinds are registered; F-8's visible queue for sequential domains is not built yet.</desc>
<!-- provenance
     serves:   BUILD
     shows:    F-6's seven driver methods and where the build puts each (the Driver, the
               core's Collection, the Settlement seam), the axes describe returns, three
               of the registry's drivers behind one interface, and the conformance suite
               that gates them.
     sources:  docs/01-furps.md
               docs/02-implementation-plan.md
               CLAUDE.md
               module/src/drivers/driver.nim
               module/src/drivers/registry.nim
               module/src/settlement/settlement.nim
     evidence: [from-source] The seven method names and what describe returns, verbatim
                   from F-6; the r=1/r=2 characterisation from F-7; S-1's no-merge-on-red
                   rule
               [from-source] The split, read from the build: driver.nim (describe,
                   verifyContribution, environment, Collection), intents/materialization.nim
                   (canonicalize and the fold hooks), drivers/manifest.nim and profile.nim,
                   settlement/settlement.nim (assemble, submit, watch); the twelve kinds from
                   drivers/registry.nim. F-8's queue is not in the code
     recheck:  When a driver kind is added to registry.nim, the Driver's methods change,
               or F-8's queue lands.
-->

  <rect width="880" height="616" fill="#E4E6E0"/>

  <text x="40" y="42" font-size="19" font-weight="600" fill="#1A1F1C" letter-spacing="-0.3">The core routes bytes it cannot read</text>
  <text x="40" y="64" font-size="13.5" fill="#656E66">Every difference between one settlement system and another lives behind this seam, described rather than hardcoded.</text>

  <rect x="40" y="80" width="800" height="30" rx="5" fill="#DFEDE6" stroke="#1E6B52" stroke-width="1.2"/>
  <rect x="52" y="88" width="84" height="15" rx="7.5" fill="#1E6B52"/>
  <text x="94" y="99" font-size="8" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.08em" text-anchor="middle" fill="#DFEDE6">BUILT · INV 6</text>
  <text x="148" y="99" font-size="10" fill="#2A4A3C">F-6, F-7, S-1 built at P1–P2 · F-6's seven methods split across the Driver, the core and the Settlement seam · <tspan font-weight="600" fill="#A32D1E">F-8's queue: not yet</tspan></text>

  <!-- ══ core ══ -->
  <rect x="40" y="130" width="800" height="52" rx="6" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1.4"/>
  <text x="56" y="152" font-size="12" font-weight="600" fill="#1A1F1C">The core<tspan font-size="10.5" font-weight="400" fill="#3F4742">&#160;— lifecycle, log, encoding, the re-derivation check</tspan></text>
  <text x="56" y="170" font-size="10.5" font-weight="600" fill="#A32D1E">It never interprets contribution bytes. It routes opaque blobs and asks the driver what they mean.</text>

  <!-- ══ the interface ══ -->
  <text x="40" y="206" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#656E66">THE INTERFACE — F-6 NAMES SEVEN METHODS; THE BUILD SPLITS THEM THREE WAYS</text>

  <rect x="40" y="214" width="106" height="26" rx="4" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="93" y="231" font-size="10" text-anchor="middle" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">describe</text>
  <rect x="154" y="214" width="106" height="26" rx="4" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="207" y="231" font-size="10" text-anchor="middle" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">canonicalize</text>
  <rect x="268" y="214" width="106" height="26" rx="4" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="321" y="231" font-size="10" text-anchor="middle" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">verify</text>
  <rect x="382" y="214" width="106" height="26" rx="4" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="435" y="231" font-size="10" text-anchor="middle" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">progress</text>
  <rect x="496" y="214" width="106" height="26" rx="4" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="549" y="231" font-size="10" text-anchor="middle" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">assemble</text>
  <rect x="610" y="214" width="106" height="26" rx="4" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="663" y="231" font-size="10" text-anchor="middle" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">submit</text>
  <rect x="724" y="214" width="116" height="26" rx="4" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="782" y="231" font-size="10" text-anchor="middle" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">watch</text>

  <!-- where each lives in the build -->
  <path d="M 42 244 L 42 250 L 372 250 L 372 244 M 384 244 L 384 250 L 486 250 L 486 244 M 498 244 L 498 250 L 838 250 L 838 244" stroke="#8A928C" stroke-width="1.2" fill="none"/>
  <text x="207" y="264" font-size="9" text-anchor="middle" fill="#656E66"><tspan font-weight="600" fill="#1A1F1C">Driver</tspan> — plus environment · manifest · profile · fold hooks</text>
  <text x="435" y="264" font-size="9" text-anchor="middle" fill="#656E66"><tspan font-weight="600" fill="#1A1F1C">core</tspan> Collection</text>
  <text x="668" y="264" font-size="9" text-anchor="middle" fill="#656E66"><tspan font-weight="600" fill="#1A1F1C">Settlement seam</tspan> — chosen by the driver's profile</text>

  <!-- ══ what describe returns ══ -->
  <rect x="40" y="280" width="800" height="94" rx="6" fill="#F7F8F5" stroke="#4B33C4" stroke-width="1.2"/>
  <text x="56" y="302" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#4B33C4">WHAT describe RETURNS — THE THREE DIVERGENCE AXES, PLUS POLICY SHAPE</text>

  <text x="56" y="326" font-size="10.5" fill="#3F4742"><tspan font-weight="600" fill="#1A1F1C">round count r</tspan> — Safe is the degenerate r=1. FROST at r=2 is the round model's real test: nonce commitments, then partial signatures.</text>
  <text x="56" y="344" font-size="10.5" fill="#3F4742"><tspan font-weight="600" fill="#1A1F1C">serialization domain</tspan> — a domain tag on the signed bytes; F-8's visible queue for sequential domains is not built yet.</text>
  <text x="56" y="362" font-size="10.5" fill="#3F4742"><tspan font-weight="600" fill="#1A1F1C">finality descriptor</tspan> — which is how a reorg becomes a state transition rather than a silent rewrite. <tspan font-weight="600" fill="#1A1F1C">threshold</tspan> — the policy shape, k of n.</text>

  <!-- ══ drivers ══ -->
  <text x="40" y="402" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#656E66">THREE OF THE REGISTRY'S DRIVERS, ONE INTERFACE, ONE SUITE</text>

  <rect x="40" y="412" width="256" height="76" rx="6" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="56" y="432" font-size="11" font-weight="600" fill="#1A1F1C">Stub</text>
  <text x="56" y="450" font-size="10" fill="#3F4742">Configurable r and k (default r=1, k=2).</text>
  <text x="56" y="464" font-size="10" fill="#3F4742">Integration tests use this rather</text>
  <text x="56" y="478" font-size="10" fill="#3F4742">than mocking the interface.</text>

  <rect x="312" y="412" width="256" height="76" rx="6" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="328" y="432" font-size="11" font-weight="600" fill="#1A1F1C">Safe</text>
  <text x="328" y="450" font-size="10" fill="#3F4742">r=1. EIP-712 computed locally,</text>
  <text x="328" y="464" font-size="10" fill="#3F4742">with no transaction service in</text>
  <text x="328" y="478" font-size="10" fill="#3F4742">the loop at all.</text>

  <rect x="584" y="412" width="256" height="76" rx="6" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="600" y="432" font-size="11" font-weight="600" fill="#1A1F1C">FROST<tspan font-size="9.5" font-weight="400" fill="#656E66">&#160;— frost · btc-frost · lez-frost</tspan></text>
  <text x="600" y="450" font-size="10" fill="#3F4742">r=2: nonce commitments, then partials.</text>
  <text x="600" y="464" font-size="10" fill="#3F4742">On Bitcoin and LEZ one aggregate sig</text>
  <text x="600" y="478" font-size="10" fill="#3F4742">settles: chain sees no signer set.</text>

  <text x="40" y="508" font-size="10" fill="#3F4742"><tspan font-weight="600" fill="#1A1F1C">Also registered:</tspan> threshold and unanimous (Ed25519 k-of-n) · invoke · eip191 · btc-p2wsh · btc-tapscript · lez-multisig — twelve kinds.</text>

  <!-- ══ the gate ══ -->
  <rect x="40" y="522" width="800" height="52" rx="6" fill="#23282A"/>
  <text x="56" y="544" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#96A19B">S-1 — THE SUITE IS THE CONTRACT</text>
  <text x="56" y="562" font-size="11.5" font-weight="600" fill="#DCE2DE">Shared fixtures across rounds, domains and finality. No driver feature merges with conformance red.</text>

  <text x="40" y="600" font-size="10.5" font-weight="600" fill="#A32D1E">The three axes are load-bearing and must not be collapsed for convenience —<tspan font-weight="400" fill="#3F4742">&#160;collapsing one is how a client quietly becomes single-chain.</tspan></text>
</svg>
