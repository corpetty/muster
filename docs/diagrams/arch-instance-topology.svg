<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>One instance of Muster, running</title>
  <desc>Two processes on one machine — an isolated ui-host holding the QML view and a QtRO replica, and the app process holding Logos Core and every module — with one socket between them, per-instance state on disk, and two connections that leave the device.</desc>
<!-- provenance
     serves:   BOTH
     shows:    One running instance: the isolated ui-host process holding the QML view
               and a QtRO replica, the app process holding Logos Core and every module,
               per-instance state on disk, and the two live remote dependencies that
               leave the machine.
     sources:  demo/muster-ui/README.md
               demo/muster-ui/metadata.json
               demo/muster-ui/src/ChatBackend.h
               demo/muster-ui/src/ChatBackendWallet.cpp
               demo/GAPS.md
     evidence: [from-source] The process split, the module set, which side of the QtRO
                   seam ChatBackend sits on, and the wallet-path derivation — all read off
                   the code and the module README rather than reconstructed
               [from-source] What each remote dependency observes, carried from GAPS.md;
                   the store-node subscription-shape leak is the documented shape of one-
                   topic-per-conversation delivery, not separately measured
     recheck:  P3 and P4. ADR-010 may change which module mints identity, and the
               specified client replaces the muster_ui plugin box with muster-module.lgx
               plus muster-ui.lgx across the same seam.
-->

  <rect width="880" height="600" fill="#E4E6E0"/>

  <text x="40" y="46" font-size="19" font-weight="600" fill="#1A1F1C" letter-spacing="-0.3">One instance, running</text>
  <text x="40" y="70" font-size="13.5" fill="#656E66">Two processes, one socket between them, and two connections that leave the machine</text>

  <!-- ══ UI-HOST PROCESS ══ -->
  <rect x="40" y="104" width="190" height="240" rx="8" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="52" y="123" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#656E66">UI-HOST PROCESS</text>

  <rect x="52" y="134" width="166" height="56" rx="3" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1"/>
  <text x="135" y="154" font-size="11" font-weight="600" text-anchor="middle" fill="#1A1F1C">QML view</text>
  <text x="135" y="169" font-size="9" text-anchor="middle" fill="#656E66">ChatView + ChatUi,</text>
  <text x="135" y="181" font-size="9" text-anchor="middle" fill="#656E66">on Logos.Theme</text>

  <rect x="52" y="200" width="166" height="56" rx="3" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="135" y="220" font-size="11" font-weight="600" text-anchor="middle" fill="#1A1F1C">ChatBackend replica</text>
  <text x="135" y="235" font-size="9" text-anchor="middle" fill="#656E66">properties · slots · signals</text>
  <text x="135" y="247" font-size="9" text-anchor="middle" fill="#656E66">generated from the .rep</text>

  <text x="135" y="285" font-size="9.5" text-anchor="middle" fill="#656E66">It renders. It holds no keys,</text>
  <text x="135" y="298" font-size="9.5" text-anchor="middle" fill="#656E66">and reaches nothing itself.</text>

  <!-- ══ THE SEAM ══ -->
  <path d="M 234 224 L 284 224" stroke="#4B33C4" stroke-width="1.4" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B33C4"/>
    </marker>
  </defs>
  <text x="259" y="216" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" text-anchor="middle" fill="#4B33C4">QtRO</text>

  <!-- ══ APP PROCESS ══ -->
  <rect x="290" y="104" width="350" height="240" rx="8" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="302" y="123" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#656E66">APP PROCESS — STARTS LOGOS CORE</text>

  <rect x="302" y="132" width="326" height="36" rx="3" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1"/>
  <text x="465" y="147" font-size="11" font-weight="600" text-anchor="middle" fill="#1A1F1C">muster_ui plugin</text>
  <text x="465" y="161" font-size="9" text-anchor="middle" fill="#656E66">ChatBackend — the QtRO source, and every module call</text>

  <rect x="302" y="174" width="326" height="30" rx="3" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="465" y="193" font-size="11" text-anchor="middle" fill="#1A1F1C">capability_module</text>

  <rect x="302" y="210" width="326" height="36" rx="3" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="465" y="225" font-size="11" text-anchor="middle" fill="#1A1F1C">chat_module</text>
  <text x="465" y="239" font-size="9" text-anchor="middle" fill="#656E66">embeds libchat — E2EE, MLS for groups</text>

  <rect x="302" y="252" width="326" height="36" rx="3" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="465" y="267" font-size="11" text-anchor="middle" fill="#1A1F1C">delivery_module</text>
  <text x="465" y="281" font-size="9" text-anchor="middle" fill="#656E66">embeds a Waku node — picks its own ports</text>

  <rect x="302" y="294" width="326" height="36" rx="3" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="465" y="309" font-size="11" text-anchor="middle" fill="#1A1F1C">lez_core</text>
  <text x="465" y="323" font-size="9" text-anchor="middle" fill="#656E66">embeds wallet-ffi — in memory until save()</text>

  <!-- ══ ON DISK ══ -->
  <rect x="660" y="104" width="180" height="240" rx="8" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="672" y="123" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#656E66">ON DISK</text>

  <text x="672" y="142" font-size="9.5" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">--user-dir</text>
  <text x="672" y="158" font-size="9" fill="#656E66">the session directory.</text>
  <text x="672" y="170" font-size="9" fill="#656E66">One directory is one</text>
  <text x="672" y="182" font-size="9" fill="#656E66">identity.</text>

  <text x="672" y="206" font-size="9.5" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">module_data/&lt;module&gt;/</text>
  <text x="672" y="222" font-size="9" fill="#656E66">one per module, assigned</text>
  <text x="672" y="234" font-size="9" fill="#656E66">by the host.</text>

  <text x="672" y="258" font-size="9.5" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">…/muster-wallet</text>
  <text x="672" y="274" font-size="9" fill="#656E66">derived from the chat</text>
  <text x="672" y="286" font-size="9" fill="#656E66">module's own directory,</text>
  <text x="672" y="298" font-size="9" fill="#656E66">and refused if that is</text>
  <text x="672" y="310" font-size="9" fill="#656E66">unknown rather than</text>
  <text x="672" y="322" font-size="9" fill="#656E66">shared.</text>

  <!-- ══ OUT OF THE MACHINE ══ -->
  <!-- Each connection leaves the box that actually makes it — delivery out to
       the left, lez_core out to the right — rather than dropping from an
       arbitrary point on the container, which would leave a reader to take the
       labels' word for which module reaches what. -->
  <path d="M 302 270 L 278 270 L 278 366 L 244 366 L 244 408" stroke="#8FA3F5" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#b)"/>
  <path d="M 628 312 L 650 312 L 650 366 L 636 366 L 636 408" stroke="#8FA3F5" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#b)"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8FA3F5"/>
    </marker>
  </defs>

  <rect x="40" y="380" width="800" height="110" rx="8" fill="#23282A"/>
  <text x="54" y="400" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#96A19B">BEYOND YOUR DEVICE — TWO LIVE REMOTE DEPENDENCIES</text>

  <rect x="54" y="412" width="380" height="62" rx="3" fill="#2E3436" stroke="#3A4144" stroke-width="1"/>
  <text x="244" y="432" font-size="11.5" font-weight="600" text-anchor="middle" fill="#DCE2DE">The logos.test Waku fleet</text>
  <text x="244" y="448" font-size="9" text-anchor="middle" fill="#96A19B">reached by delivery_module · 5–20 s to Online</text>
  <text x="244" y="462" font-size="9" text-anchor="middle" fill="#96A19B">sees subscription shape and timing — the contact graph</text>

  <rect x="446" y="412" width="380" height="62" rx="3" fill="#2E3436" stroke="#3A4144" stroke-width="1"/>
  <text x="636" y="432" font-size="11.5" font-weight="600" text-anchor="middle" fill="#DCE2DE">The LEZ testnet sequencer</text>
  <text x="636" y="448" font-size="9" text-anchor="middle" fill="#96A19B">reached by lez_core</text>
  <text x="636" y="462" font-size="9" text-anchor="middle" fill="#96A19B">sees that a transfer happened, and when</text>

  <!-- ══ FOOTNOTES ══ -->
  <text x="40" y="516" font-size="10" fill="#1A1F1C" font-weight="600">Two peers on one machine need nothing but separate <tspan font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="400">--user-dir</tspan>.</text>
  <text x="40" y="532" font-size="10" fill="#656E66">The QtRO socket name is randomised per instance and the Waku node picks its own ports, so nothing else collides. Sharing a directory would</text>
  <text x="40" y="546" font-size="10" fill="#656E66">merge the two identities — which is why the wallet path is derived from the chat module's assigned directory, and refused when there is none.</text>

  <text x="40" y="574" font-size="10" fill="#A32D1E" font-weight="600">There is no offline or local mode.</text>
  <text x="243" y="574" font-size="10" fill="#656E66">Both dependencies above are live and remote: local-first is a property of the specified client, not of this build.</text>
</svg>
