<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 474" width="880" height="474" font-family="'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>Content is hidden. Metadata is not.</title>
  <desc>Across every step of the journey, message and payment content stays inside the conversation, while the fact that something passed, its size and its timing remain visible to a relay.</desc>
<!-- provenance
     serves:   POST
     shows:    Content against metadata across the journey: what end-to-end encryption
               covers, and what it does not.
     sources:  docs/00-vision.md
               demo/GAPS.md
     evidence: [from-source] One content topic per conversation is the documented shape
                   of delivery; the subscription-shape leak follows from it and was not
                   separately measured
     recheck:  If LOGOS-MIXNET moves off status raw, or receive-over-mix lands. Both
               would change what this figure's metadata column says.
-->

  <rect width="880" height="474" fill="#E4E6E0"/>

  <text x="40" y="46" font-size="19" font-weight="600" fill="#1A1F1C" letter-spacing="-0.3">Encryption protects content. It does not protect shape.</text>
  <text x="40" y="70" font-size="13.5" fill="#656E66">What a store node observes at each step, whether or not it can read a word</text>

  <!-- header row -->
  <text x="40" y="112" font-size="10.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#656E66">STEP</text>
  <text x="330" y="112" font-size="10.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#1E6B52">HIDDEN FROM A RELAY</text>
  <text x="620" y="112" font-size="10.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#A32D1E">VISIBLE TO A RELAY</text>
  <line x1="40" y1="124" x2="840" y2="124" stroke="#C6CBC3" stroke-width="1"/>

  <g font-size="12.5">
    <!-- discovery -->
    <text x="40" y="154" font-size="13.5" font-weight="600" fill="#1A1F1C">Finding each other</text>
    <text x="40" y="174" font-size="11.5" fill="#656E66">an address, out of band</text>
    <rect x="322" y="136" width="266" height="52" rx="6" fill="#DFEDE6"/>
    <text x="336" y="156" fill="#1A1F1C">what you said</text>
    <text x="336" y="176" fill="#1A1F1C">any name resolved — none was</text>
    <rect x="612" y="136" width="228" height="52" rx="6" fill="#F6E3DF"/>
    <text x="626" y="156" fill="#1A1F1C">which topics you subscribe to</text>
    <text x="626" y="176" fill="#1A1F1C">when you publish and fetch</text>

    <!-- conversation -->
    <text x="40" y="222" font-size="13.5" font-weight="600" fill="#1A1F1C">Talking</text>
    <text x="40" y="242" font-size="11.5" fill="#656E66">end-to-end encrypted</text>
    <rect x="322" y="204" width="266" height="52" rx="6" fill="#DFEDE6"/>
    <text x="336" y="224" fill="#1A1F1C">message content</text>
    <text x="336" y="244" fill="#1A1F1C">who said which part</text>
    <rect x="612" y="204" width="228" height="52" rx="6" fill="#F6E3DF"/>
    <text x="626" y="224" fill="#1A1F1C">that a message passed</text>
    <text x="626" y="244" fill="#1A1F1C">approximate size, timing</text>

    <!-- address -->
    <text x="40" y="290" font-size="13.5" font-weight="600" fill="#1A1F1C">Agreeing where to pay</text>
    <text x="40" y="310" font-size="11.5" fill="#656E66">shielded receiving keys</text>
    <rect x="322" y="272" width="266" height="52" rx="6" fill="#DFEDE6"/>
    <text x="336" y="292" fill="#1A1F1C">the address shared</text>
    <text x="336" y="312" fill="#1A1F1C">that it is a payment at all</text>
    <rect x="612" y="272" width="228" height="52" rx="6" fill="#F6E3DF"/>
    <text x="626" y="292" fill="#1A1F1C">that something was shared</text>
    <text x="626" y="312" fill="#1A1F1C">when</text>

    <!-- payment -->
    <text x="40" y="358" font-size="13.5" font-weight="600" fill="#1A1F1C">Paying</text>
    <text x="40" y="378" font-size="11.5" fill="#656E66">shielded — observer here is the zone</text>
    <rect x="322" y="340" width="266" height="52" rx="6" fill="#DFEDE6"/>
    <text x="336" y="360" fill="#1A1F1C">amount, sender, recipient</text>
    <text x="336" y="380" fill="#1A1F1C">— none of it on the record</text>
    <rect x="612" y="340" width="228" height="52" rx="6" fill="#23282A"/>
    <text x="626" y="360" fill="#DCE2DE">that a transfer happened</text>
    <text x="626" y="380" fill="#DCE2DE">the block timestamp</text>
  </g>

  <line x1="40" y1="410" x2="840" y2="410" stroke="#C6CBC3" stroke-width="1"/>
  <text x="40" y="432" font-size="12.5" fill="#1A1F1C">Closing the right-hand column needs a mixnet at the transport layer — an infrastructure change, not an app one.</text>
  <text x="40" y="452" font-size="12" fill="#656E66">Status: <tspan font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11.5">specified</tspan>, at LIP status <tspan font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11.5">raw</tspan>, with a send-only proof of concept. Not on the near-term roadmap.</text>
</svg>
