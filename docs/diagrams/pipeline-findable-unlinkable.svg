<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 496" width="880" height="496" font-family="'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>Findable or unlinkable: two discovery models on one stack</title>
  <desc>Shielded receiving keys handed over in band against an on-chain label registered publicly. Both are in the execution zone's contract; only the first is wired into this build, so the comparison is an argument in prose rather than a screenshot.</desc>
<!-- provenance
     serves:   POST
     shows:    Two discovery models the same stack ships: shielded receiving keys handed
               over in band, against an on-chain label anyone can resolve — with which
               one is actually wired into the build marked on its face.
     sources:  docs/posts/01-discovery-supporting-material.md
               demo/GAPS.md
     evidence: [measured] The shielded-keys column describes what the build does: an
                   address handed over in band, nothing resolved, no third party involved
               [from-source] add_label and resolve_label are present in the generated
                   contract and NOT exercised in this build. The figure marks that on the
                   column itself rather than in a footnote, because the earlier prose draft
                   implied a UI that does not exist
     recheck:  If the label system is ever wired in. Until then the right-hand column
               stays dashed and the caption stays honest about it.
-->

  <rect width="880" height="496" fill="#E4E6E0"/>

  <text x="40" y="42" font-size="19" font-weight="600" fill="#1A1F1C" letter-spacing="-0.3">Findable, or unlinkable</text>
  <text x="40" y="64" font-size="13.5" fill="#656E66">The same stack ships both discovery models. The costs are real on both sides, and they are not the same cost.</text>

  <!-- column headers -->
  <rect x="225" y="86" width="310" height="42" rx="5" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1.4"/>
  <text x="239" y="105" font-size="12" font-weight="600" fill="#1A1F1C">Shielded receiving keys</text>
  <text x="239" y="120" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#4B33C4">WIRED INTO THIS BUILD</text>

  <rect x="545" y="86" width="295" height="42" rx="5" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="559" y="105" font-size="12" font-weight="600" fill="#1A1F1C">An on-chain label</text>
  <text x="559" y="120" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#A32D1E">IN THE CONTRACT, NOT IN THE APP</text>

  <!-- ── row 1 ── -->
  <text x="40" y="152" font-size="10.5" font-weight="600" fill="#1A1F1C">How you are found</text>
  <rect x="225" y="136" width="310" height="46" rx="4" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="239" y="156" font-size="10" fill="#3F4742">An address handed over in band, inside the</text>
  <text x="239" y="170" font-size="10" fill="#3F4742">encrypted room, or across a table.</text>
  <rect x="545" y="136" width="295" height="46" rx="4" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="559" y="156" font-size="10" fill="#3F4742">A human-readable name you register</text>
  <text x="559" y="170" font-size="10" fill="#3F4742">once, and anyone resolves.</text>

  <!-- ── row 2 ── -->
  <text x="40" y="202" font-size="10.5" font-weight="600" fill="#1A1F1C">Who learns you were</text>
  <text x="40" y="216" font-size="10.5" font-weight="600" fill="#1A1F1C">looked up</text>
  <rect x="225" y="190" width="310" height="46" rx="4" fill="#DFEDE6" stroke="#1E6B52" stroke-width="1.2"/>
  <text x="239" y="210" font-size="10" font-weight="600" fill="#1E6B52">Nobody.</text>
  <text x="239" y="224" font-size="10" fill="#3F4742">Nothing is resolved, so there is no lookup.</text>
  <rect x="545" y="190" width="295" height="46" rx="4" fill="#F6E3DF" stroke="#A32D1E" stroke-width="1.2"/>
  <text x="559" y="210" font-size="10" font-weight="600" fill="#A32D1E">Anyone.</text>
  <text x="559" y="224" font-size="10" fill="#3F4742">The lookup is itself a public act.</text>

  <!-- ── row 3 ── -->
  <text x="40" y="262" font-size="10.5" font-weight="600" fill="#1A1F1C">Permanence</text>
  <rect x="225" y="244" width="310" height="46" rx="4" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="239" y="264" font-size="10" fill="#3F4742">None. Nothing outlives the conversation</text>
  <text x="239" y="278" font-size="10" fill="#3F4742">it was shared in.</text>
  <rect x="545" y="244" width="295" height="46" rx="4" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="559" y="264" font-size="10" fill="#3F4742">The mapping is permanent, and it is</text>
  <text x="559" y="278" font-size="10" fill="#3F4742">on a public ledger.</text>

  <!-- ── row 4 ── -->
  <text x="40" y="316" font-size="10.5" font-weight="600" fill="#1A1F1C">Convenience</text>
  <rect x="225" y="298" width="310" height="46" rx="4" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="239" y="318" font-size="10" fill="#3F4742">Lower. Somebody has to hand you</text>
  <text x="239" y="332" font-size="10" fill="#3F4742">something, over a channel you trust.</text>
  <rect x="545" y="298" width="295" height="46" rx="4" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="559" y="318" font-size="10" font-weight="600" fill="#1A1F1C">Genuinely nicer.</text>
  <text x="559" y="332" font-size="10" fill="#3F4742">That is not a small thing, and saying so</text>
  <text x="559" y="344" font-size="10" fill="#3F4742">costs the argument nothing.</text>

  <!-- ── the honest status ── -->
  <rect x="40" y="366" width="800" height="106" rx="6" fill="#F7F8F5" stroke="#A32D1E" stroke-width="1.2"/>
  <text x="56" y="388" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#A32D1E">BOTH ARE IN THE STACK. ONE IS IN THE APP.</text>

  <text x="56" y="410" font-size="10.5" fill="#3F4742"><tspan font-family="'DM Mono',ui-monospace,Menlo,monospace">lez_core</tspan> exposes <tspan font-family="'DM Mono',ui-monospace,Menlo,monospace">add_label</tspan> and <tspan font-family="'DM Mono',ui-monospace,Menlo,monospace">resolve_label</tspan> — read off the generated contract, and <tspan font-weight="600">not exercised in this build</tspan>.</text>
  <text x="56" y="426" font-size="10.5" font-weight="600" fill="#A32D1E">So this fork is an argument in prose, not a screenshot. Say that rather than implying a UI that is not there.</text>

  <text x="56" y="452" font-size="10.5" fill="#3F4742">Which one is right depends entirely on whether you would rather be <tspan font-style="italic">findable</tspan> or <tspan font-style="italic">unlinkable</tspan>. There is no universal answer —</text>
  <text x="56" y="466" font-size="10.5" fill="#3F4742">which is exactly why it is worth showing as a fork, with both costs named, rather than settled quietly in a default.</text>
</svg>
