<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 546" width="880" height="546" font-family="'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>The intent lifecycle, and which of it exists today</title>
  <desc>An intent moves draft, proposed, collecting, executable, submitted, settling, final — with dropped and expired reachable from any pre-submitted state. The state is derived entirely by reducing events. Specified as F-3; partly built.</desc>
<!-- provenance
     serves:   BOTH
     shows:    The seven lifecycle states with the four teaching questions each of them
               answers, and which states the demo actually reaches.
     sources:  docs/01-furps.md
               docs/00-vision.md
               docs/02-implementation-plan.md
               demo/GAPS.md
     evidence: [from-source] The seven states, their order, and dropped/expired being
                   reachable from any pre-submitted state — verbatim from F-3
               [from-source] The four questions verbatim from the vision's lifecycle-as-
                   curriculum section
               [measured] Which states the demo reaches — propose, collect approvals, pay
                   — observed in the running build
     recheck:  Built at P1; the P3 coordination flow folds these states over a shared log
               (state = reduce(log)). Re-check if the state set changes.
-->

  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A928C"/>
    </marker>
  </defs>

  <rect width="880" height="546" fill="#E4E6E0"/>

  <text x="40" y="42" font-size="19" font-weight="600" fill="#1A1F1C" letter-spacing="-0.3">The spine of the walkthrough</text>
  <text x="40" y="64" font-size="13.5" fill="#656E66">Seven states, none of them stored — each one is what you get when you reduce the events so far.</text>

  <rect x="40" y="80" width="800" height="30" rx="5" fill="#F6E3DF" stroke="#A32D1E" stroke-width="1.2"/>
  <rect x="52" y="88" width="150" height="15" rx="7.5" fill="#A32D1E"/>
  <text x="127" y="99" font-size="8" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.08em" text-anchor="middle" fill="#F6E3DF">SPECIFIED · PART BUILT</text>
  <text x="214" y="99" font-size="10" fill="#3F4742">F-3 · built at P1 · the demo has propose, collect approvals and pay; the states below marked in purple are the ones it reaches</text>

  <!-- ══ the seven states ══ -->
  <rect x="40" y="146" width="104" height="44" rx="5" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1.4"/>
  <text x="92" y="166" font-size="11" text-anchor="middle" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" fill="#1A1F1C">draft</text>
  <text x="92" y="181" font-size="8.5" text-anchor="middle" fill="#4B33C4">in the demo</text>

  <rect x="156" y="146" width="104" height="44" rx="5" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1.4"/>
  <text x="208" y="166" font-size="11" text-anchor="middle" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" fill="#1A1F1C">proposed</text>
  <text x="208" y="181" font-size="8.5" text-anchor="middle" fill="#4B33C4">in the demo</text>

  <rect x="272" y="146" width="104" height="44" rx="5" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1.4"/>
  <text x="324" y="164" font-size="11" text-anchor="middle" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" fill="#1A1F1C">collecting</text>
  <text x="324" y="176" font-size="8.5" text-anchor="middle" fill="#656E66">round r</text>
  <text x="324" y="186" font-size="8.5" text-anchor="middle" fill="#4B33C4">in the demo, at r=1</text>

  <rect x="388" y="146" width="104" height="44" rx="5" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1.4"/>
  <text x="440" y="166" font-size="11" text-anchor="middle" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" fill="#1A1F1C">executable</text>
  <text x="440" y="181" font-size="8.5" text-anchor="middle" fill="#4B33C4">in the demo</text>

  <rect x="504" y="146" width="104" height="44" rx="5" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="556" y="166" font-size="11" text-anchor="middle" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" fill="#1A1F1C">submitted</text>
  <text x="556" y="181" font-size="8.5" text-anchor="middle" fill="#656E66">not modelled</text>

  <rect x="620" y="146" width="104" height="44" rx="5" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="672" y="166" font-size="11" text-anchor="middle" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" fill="#1A1F1C">settling</text>
  <text x="672" y="181" font-size="8.5" text-anchor="middle" fill="#656E66">not modelled</text>

  <rect x="736" y="146" width="104" height="44" rx="5" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="788" y="166" font-size="11" text-anchor="middle" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" fill="#1A1F1C">final</text>
  <text x="788" y="181" font-size="8.5" text-anchor="middle" fill="#656E66">not modelled</text>

  <path d="M 144 168 L 154 168 M 260 168 L 270 168 M 376 168 L 386 168 M 492 168 L 502 168 M 608 168 L 618 168 M 724 168 L 734 168" stroke="#8A928C" stroke-width="1.2"/>

  <!-- ══ the escape hatches ══ -->
  <path d="M 92 190 L 92 216 L 300 216" stroke="#8A928C" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
  <path d="M 208 190 L 208 216" stroke="#8A928C" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
  <path d="M 324 190 L 324 216" stroke="#8A928C" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
  <path d="M 440 190 L 440 216 L 380 216" stroke="#8A928C" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
  <path d="M 340 216 L 340 228" stroke="#8A928C" stroke-width="1.2" fill="none" marker-end="url(#g)"/>

  <rect x="264" y="230" width="152" height="26" rx="13" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="340" y="247" font-size="10" text-anchor="middle" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#656E66">dropped · expired</text>
  <text x="430" y="247" font-size="10" fill="#656E66">reachable from any pre-submitted state</text>

  <!-- ══ four questions ══ -->
  <rect x="40" y="278" width="800" height="128" rx="6" fill="#F7F8F5" stroke="#4B33C4" stroke-width="1.2"/>
  <text x="56" y="300" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#4B33C4">EVERY STATE ANSWERS THE SAME FOUR QUESTIONS ON SCREEN</text>

  <text x="56" y="324" font-size="10.5" fill="#3F4742"><tspan font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#4B33C4">1</tspan>  <tspan font-weight="600" fill="#1A1F1C">What just happened?</tspan> The mechanical step, in plain language.</text>
  <text x="56" y="344" font-size="10.5" fill="#3F4742"><tspan font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#4B33C4">2</tspan>  <tspan font-weight="600" fill="#1A1F1C">What does Logos protect here?</tspan> Which property guarantees it — and every such claim resolves to a requirement id and a test.</text>
  <text x="56" y="364" font-size="10.5" fill="#3F4742"><tspan font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#4B33C4">3</tspan>  <tspan font-weight="600" fill="#1A1F1C">Where do others leak?</tspan> The same step on a conventional stack, with the system, the step and the observer named.</text>
  <text x="56" y="384" font-size="10.5" fill="#3F4742"><tspan font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#4B33C4">4</tspan>  <tspan font-weight="600" fill="#1A1F1C">What is still open, and what would close it?</tspan> The fix, and its status from a closed set: shipped / specified / partial / none.</text>

  <!-- ══ why 4 ══ -->
  <rect x="40" y="422" width="800" height="46" rx="6" fill="#23282A"/>
  <text x="56" y="443" font-size="11.5" font-weight="600" fill="#DCE2DE">Question four is not a disclaimer appended to question three.<tspan font-size="11" font-weight="400" fill="#96A19B">&#160;It is the one that makes this a curriculum</tspan></text>
  <text x="56" y="458" font-size="11" fill="#96A19B">rather than a pitch, and the only one a reader can act on — by choosing differently, contributing, or knowing what to wait for.</text>

  <text x="40" y="494" font-size="10.5" fill="#3F4742">The states are derived <tspan font-style="italic">entirely</tspan> by reducing events, so this diagram is not a controller — there is nothing that could disagree with it.</text>
  <text x="40" y="512" font-size="10.5" font-weight="600" fill="#A32D1E">And if a step cannot be shown truthfully, that is a product bug, not a copy problem.<tspan font-weight="400" fill="#3F4742">&#160;The walkthrough never simulates a guarantee.</tspan></text>
</svg>
