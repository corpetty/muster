<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 568" width="880" height="568" font-family="'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>Muster scored on its own matrix</title>
  <desc>Scored strictly against the demo as it runs: one stage closed by default, three partial, one leaking, two not yet assessed.</desc>
<!-- provenance
     serves:   POST
     shows:    Muster scored closed/partial/leaks on its own seven-stage matrix, with
               Ordering and Enforcement deliberately left unassessed.
     sources:  docs/posts/01-discovery-supporting-material.md
               demo/GAPS.md
     evidence: [measured] Discovery and Negotiation cells — observed on this machine,
                   2026-08-11/12
               [from-source] Contracting and Settlement cells — read off the build and
                   the consumed contracts, not separately exercised
     recheck:  Every phase. This figure scores the demo as it runs; it goes stale the
               moment the build gains or loses a protection. The two unassessed cells
               must stay unassessed until the zone's mempool and sequencer models are
               confirmed.
-->

  <rect width="880" height="568" fill="#E4E6E0"/>

  <text x="40" y="46" font-size="19" font-weight="600" fill="#1A1F1C" letter-spacing="-0.3">The same standard, turned on ourselves</text>
  <text x="40" y="70" font-size="13.5" fill="#656E66">Muster as it actually runs — not as specified. Default vs opt-in, shipped vs roadmap, strictly.</text>

  <!-- legend -->
  <g transform="translate(40,96)">
    <circle cx="8" cy="0" r="7.5" fill="#1E6B52"/>
    <text x="22" y="4.5" font-size="11.5" fill="#656E66">closed by default</text>
    <circle cx="152" cy="0" r="7.5" fill="none" stroke="#8A6D1F" stroke-width="1.6"/>
    <path d="M152 -7.5 A7.5 7.5 0 0 1 152 7.5 Z" fill="#8A6D1F"/>
    <text x="166" y="4.5" font-size="11.5" fill="#656E66">partial or opt-in</text>
    <circle cx="290" cy="0" r="7.5" fill="none" stroke="#A32D1E" stroke-width="1.6"/>
    <text x="304" y="4.5" font-size="11.5" fill="#656E66">essentially unaddressed</text>
    <text x="466" y="4.5" font-size="11.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#656E66">?</text>
    <text x="480" y="4.5" font-size="11.5" fill="#656E66">not assessed — needs the zone's answer</text>
  </g>

  <line x1="40" y1="120" x2="840" y2="120" stroke="#C6CBC3" stroke-width="1"/>

  <g>
    <!-- 01 Discovery -->
    <text x="40" y="152" font-size="9.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#656E66">01</text>
    <text x="70" y="152" font-size="14" font-weight="600" fill="#1A1F1C">Discovery</text>
    <circle cx="800" cy="147" r="8.5" fill="none" stroke="#8A6D1F" stroke-width="1.6"/>
    <path d="M800 138.5 A8.5 8.5 0 0 1 800 155.5 Z" fill="#8A6D1F"/>
    <text x="70" y="172" font-size="12" fill="#656E66">No directory, no lookup, no server that learns the edge — but the introduction is</text>
    <text x="70" y="189" font-size="12" fill="#656E66">unauthenticated, and a relay still sees subscription shape.</text>

    <!-- 02 Diligence -->
    <text x="40" y="221" font-size="9.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#656E66">02</text>
    <text x="70" y="221" font-size="14" font-weight="600" fill="#1A1F1C">Diligence</text>
    <circle cx="800" cy="216" r="8.5" fill="none" stroke="#A32D1E" stroke-width="1.6"/>
    <text x="70" y="241" font-size="12" fill="#656E66">Not addressed at all. Scoring this closed because “we don't do lookups” would be</text>
    <text x="70" y="258" font-size="12" fill="#656E66">the overclaim this matrix exists to catch.</text>

    <!-- 03 Negotiation -->
    <rect x="34" y="272" width="812" height="62" rx="8" fill="#DFEDE6"/>
    <text x="40" y="294" font-size="9.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#1E6B52">03</text>
    <text x="70" y="294" font-size="14" font-weight="600" fill="#1A1F1C">Negotiation</text>
    <circle cx="800" cy="289" r="8.5" fill="#1E6B52"/>
    <text x="70" y="314" font-size="12" fill="#1A1F1C">Terms are agreed inside an encrypted room with no coordination service anywhere in it.</text>
    <text x="70" y="331" font-size="12" fill="#1A1F1C">No RPC, no quote infra, no operator sees the proposal, the approvals or the timing.</text>

    <!-- 04 Contracting -->
    <text x="40" y="366" font-size="9.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#656E66">04</text>
    <text x="70" y="366" font-size="14" font-weight="600" fill="#1A1F1C">Contracting</text>
    <circle cx="800" cy="361" r="8.5" fill="none" stroke="#8A6D1F" stroke-width="1.6"/>
    <path d="M800 352.5 A8.5 8.5 0 0 1 800 369.5 Z" fill="#8A6D1F"/>
    <text x="70" y="386" font-size="12" fill="#656E66">Local-first by construction — a native client, no web frontend. But the signing context is</text>
    <text x="70" y="403" font-size="12" fill="#656E66">not verifiable: the client does not re-derive what it signs.</text>
  </g>

  <!-- remaining three, compressed -->
  <line x1="40" y1="419" x2="840" y2="419" stroke="#C6CBC3" stroke-width="1"/>
  <g font-size="12">
    <text x="40" y="441" font-size="9.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#656E66">05</text>
    <text x="70" y="441" font-weight="600" fill="#1A1F1C">Ordering</text>
    <text x="146" y="441" fill="#656E66">no network-origin protection; sequencer behaviour unconfirmed</text>
    <text x="797" y="445" font-size="13" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#656E66">?</text>

    <text x="40" y="461" font-size="9.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#656E66">06</text>
    <text x="70" y="461" font-weight="600" fill="#1A1F1C">Settlement</text>
    <text x="158" y="461" fill="#656E66">shielded both ends by default — but the recipient needs a workaround to see it</text>
    <circle cx="800" cy="457" r="8.5" fill="none" stroke="#8A6D1F" stroke-width="1.6"/>
    <path d="M800 448.5 A8.5 8.5 0 0 1 800 465.5 Z" fill="#8A6D1F"/>

    <text x="40" y="481" font-size="9.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#656E66">07</text>
    <text x="70" y="481" font-weight="600" fill="#1A1F1C">Enforcement</text>
    <text x="166" y="481" fill="#656E66">a single named sequencer points at ○ — confirm the production model first</text>
    <text x="797" y="485" font-size="13" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#656E66">?</text>
  </g>

  <line x1="40" y1="502" x2="840" y2="502" stroke="#C6CBC3" stroke-width="1"/>
  <text x="40" y="526" font-size="12.5" fill="#1A1F1C">One stage of seven closed by default — and it is the one the rest of the field leaves open.</text>
  <text x="40" y="545" font-size="11.5" fill="#656E66">A prototype arguing that the middle of the pipeline is neglected should be judged on whether it closed the middle.</text>
</svg>
