<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 550" width="880" height="550" font-family="'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>Plugins emit typed blocks and nothing else</title>
  <desc>A plugin is a pure function from conversation context and user input to typed blocks and proposed effects. It never signs, never holds keys, has no ambient network access, and never gets a canvas — the render vocabulary is closed and adding to it is a core release. Specified as F-12, F-13 and FS-5. Part built: the sandbox and its invariant-3 boundary landed at P1 — a noSideEffect plugin type, a one-operation grant, typed-only output, four probes — with the block kinds text, amount, choice and fact; the plugin runtime, signed bundles, runtime manifest enforcement and the lying-plugin test are P5.</desc>
<!-- provenance
     serves:   BUILD
     shows:    A plugin as a pure function to typed blocks, the closed render vocabulary,
               what it may never do, how it is distributed, and the lying-plugin test
               that proves the boundary.
     sources:  docs/01-furps.md
               docs/02-implementation-plan.md
               CLAUDE.md
               module/src/plugins/plugin.nim
     evidence: [from-source] F-12's signature and prohibitions, F-13's six-item closed
                   vocabulary, FS-4 and FS-5 — all verbatim
               [from-source] The P5 accept criterion: a plugin whose materialization
                   diverges from its displayed effect is blocked by core, demonstrated in CI
               [from-source] Part built at P1: plugin.nim (a noSideEffect Plugin,
                   pluginGrant = {opEmitBlock}, acceptOutput typed-only, BlockKind
                   text/amount/choice/fact) and four probe_plugin_* probes. No plugin
                   runtime, bundle verification, runtime manifest enforcement or lying-plugin
                   test exists — those rows carry P5 tags
     recheck:  P5, when the plugin runtime lands. Third-party isolation via capability-
               restricted modules is ADR-007 and post-v1.
-->

  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A928C"/>
    </marker>
  </defs>

  <rect width="880" height="550" fill="#E4E6E0"/>

  <text x="40" y="42" font-size="19" font-weight="600" fill="#1A1F1C" letter-spacing="-0.3">A plugin is a pure function, and it never gets a canvas</text>
  <text x="40" y="64" font-size="13.5" fill="#656E66">The narrowest surface in the system, on purpose: what a plugin cannot do is the feature.</text>

  <rect x="40" y="80" width="800" height="30" rx="5" fill="#F6E3DF" stroke="#A32D1E" stroke-width="1.2"/>
  <rect x="52" y="88" width="150" height="15" rx="7.5" fill="#A32D1E"/>
  <text x="127" y="99" font-size="8" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.08em" text-anchor="middle" fill="#F6E3DF">SPECIFIED · PART BUILT</text>
  <text x="214" y="99" font-size="10" fill="#3F4742">F-12, F-13, FS-5 · P1 built the sandbox + inv-3 boundary (four probes) · runtime, bundles, lying-plugin test: P5</text>

  <!-- ══ the function ══ -->
  <rect x="40" y="132" width="212" height="66" rx="6" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="56" y="153" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#656E66">IN</text>
  <text x="56" y="174" font-size="10.5" fill="#1A1F1C">conversation context</text>
  <text x="56" y="189" font-size="10.5" fill="#1A1F1C">user input</text>

  <path d="M 256 165 L 300 165" stroke="#8A928C" stroke-width="1.4" fill="none" marker-end="url(#g)"/>

  <rect x="304" y="132" width="212" height="66" rx="6" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1.4"/>
  <text x="320" y="153" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#4B33C4">THE PLUGIN</text>
  <text x="320" y="176" font-size="12" font-weight="600" fill="#1A1F1C">A pure function.</text>
  <text x="320" y="191" font-size="9.5" fill="#656E66">No state of its own to keep.</text>

  <path d="M 520 165 L 564 165" stroke="#8A928C" stroke-width="1.4" fill="none" marker-end="url(#g)"/>

  <rect x="568" y="132" width="272" height="66" rx="6" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="584" y="153" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#656E66">OUT — AND ONLY THIS</text>
  <text x="584" y="174" font-size="10.5" fill="#1A1F1C">typed blocks</text>
  <text x="584" y="189" font-size="10.5" fill="#1A1F1C">proposed effects</text>

  <!-- ══ never ══ -->
  <rect x="40" y="216" width="800" height="62" rx="6" fill="#F6E3DF" stroke="#A32D1E" stroke-width="1.4"/>
  <text x="56" y="238" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#A32D1E">WHAT A PLUGIN NEVER DOES — F-12, FS-4</text>
  <text x="824" y="238" font-size="8" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.08em" text-anchor="end" fill="#1E6B52">THE NEVERS: BUILT P1 · FOUR PROBES</text>
  <text x="56" y="258" font-size="11.5" font-weight="600" fill="#1A1F1C">Never signs. Never holds keys. No ambient network access.</text>
  <text x="470" y="258" font-size="10.5" fill="#3F4742">Key material is not reachable by a plugin at all —</text>
  <text x="470" y="272" font-size="10.5" fill="#3F4742">it is not in the log, and not in any export.</text>
  <text x="56" y="272" font-size="10.5" fill="#3F4742">Declared data needs are met by the user's own node (P5).</text>

  <!-- ══ closed vocabulary ══ -->
  <text x="40" y="306" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#656E66">F-13 — THE RENDER VOCABULARY IS CLOSED</text>
  <text x="840" y="306" font-size="9.5" text-anchor="end" fill="#656E66">F-13's set, as specified · the P1 sandbox types text · amount · choice · fact</text>

  <rect x="40" y="316" width="118" height="26" rx="13" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="99" y="333" font-size="10" text-anchor="middle" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">message</text>
  <rect x="166" y="316" width="118" height="26" rx="13" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="225" y="333" font-size="10" text-anchor="middle" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">intent</text>
  <rect x="292" y="316" width="118" height="26" rx="13" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="351" y="333" font-size="10" text-anchor="middle" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">fact</text>
  <rect x="418" y="316" width="118" height="26" rx="13" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="477" y="333" font-size="10" text-anchor="middle" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">choice</text>
  <rect x="544" y="316" width="118" height="26" rx="13" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="603" y="333" font-size="10" text-anchor="middle" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">artifact</text>
  <rect x="670" y="316" width="118" height="26" rx="13" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="729" y="333" font-size="10" text-anchor="middle" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">receipt</text>

  <text x="40" y="362" font-size="10.5" fill="#3F4742">Plus system notices. <tspan font-weight="600" fill="#1A1F1C">Adding to this list is a core release, not a plugin feature</tspan> — which is what keeps a room legible when it</text>
  <text x="40" y="376" font-size="10.5" fill="#3F4742">contains things you did not install, and what makes U-7 possible: driver differences surface as copy on the same components.</text>

  <!-- ══ distribution ══ -->
  <rect x="40" y="396" width="390" height="76" rx="6" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="56" y="418" font-size="10.5" font-weight="600" fill="#1A1F1C">Installing one is trusting a hash</text>
  <text x="414" y="418" font-size="8" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.08em" text-anchor="end" fill="#A32D1E">P5 · NOT BUILT</text>
  <text x="56" y="436" font-size="10" fill="#3F4742">Signed, content-addressed bundles, verified</text>
  <text x="56" y="450" font-size="10" fill="#3F4742">against their hash before load. Not a registry,</text>
  <text x="56" y="464" font-size="10" fill="#3F4742">and so not a registry to compromise.</text>

  <rect x="450" y="396" width="390" height="76" rx="6" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="466" y="418" font-size="10.5" font-weight="600" fill="#1A1F1C">The manifest is enforced at runtime</text>
  <text x="824" y="418" font-size="8" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.08em" text-anchor="end" fill="#A32D1E">P5 · NOT BUILT</text>
  <text x="466" y="436" font-size="10" fill="#3F4742">No network, no key APIs, no storage outside</text>
  <text x="466" y="450" font-size="10" fill="#3F4742">declared scopes. For third parties the platform's</text>
  <text x="466" y="464" font-size="10" fill="#3F4742">subprocess and token model is the sandbox.</text>

  <!-- ══ the test ══ -->
  <rect x="40" y="488" width="800" height="46" rx="6" fill="#23282A"/>
  <text x="56" y="508" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#96A19B">THE P5 ACCEPT CRITERION — TO BE DEMONSTRATED IN CI · NOT YET WRITTEN</text>
  <text x="56" y="525" font-size="11.5" font-weight="600" fill="#DCE2DE">A plugin whose proposed materialization diverges from its displayed effect is blocked by the core. The lying-plugin test.</text>
</svg>
