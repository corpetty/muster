<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 638" width="880" height="638" font-family="'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>Where the data came from, and why re-derivation does not answer it</title>
  <desc>Re-deriving a materialization proves it agrees with the effect it came from and says nothing about where the effect's own inputs came from, so correctly derived data of unknown origin passes the check. F-20 makes every signing payload commit to each input's class and log position and refuses to sign an input it cannot account for; FS-10 scopes that record to the membership epoch, so the boundary it defends is the room rather than the participant. Specified as F-20 and FS-10; not built.</desc>
<!-- provenance
     serves:   BOTH
     shows:    Why re-deriving a materialization does not answer where its inputs came
               from, what F-20's provenance record commits to for each input class, the
               refusal that gives it teeth, and the two different boundaries it does and
               does not defend.
     sources:  docs/01-furps.md
               CLAUDE.md
               contracts/specs/derived-exo-3a1.spec.json
     evidence: [from-source] The four input classes and their requirement ids, the class-
                   plus-log-position record shape, and the refusal, all verbatim from F-20
               [from-source] The epoch scoping and the participant-versus-outsider
                   distinction from FS-10; the driver-described identity branch from F-6's
                   membership model via FS-7
               [from-source] The status banner's claim that no probe exists and four
                   oracles await an executor, read from derived-exo-3a1's acceptance_tests
               [illustrative] The untrusted-RPC example under the blind-spot row is a
                   worked instance chosen to make the gap concrete, not a case quoted from
                   the requirement
     recheck:  P0/P1, when the signing path first exists — and immediately if the
               model_check executor lands, since the status banner counts what is
               undischarged.
-->

  <rect width="880" height="638" fill="#E4E6E0"/>

  <text x="40" y="42" font-size="19" font-weight="600" fill="#1A1F1C" letter-spacing="-0.3">Where the data came from</text>
  <text x="40" y="64" font-size="13.5" fill="#656E66">A correct derivation from an unknown source is still a correct derivation. That is the hole.</text>

  <rect x="40" y="80" width="800" height="30" rx="5" fill="#F6E3DF" stroke="#A32D1E" stroke-width="1.2"/>
  <rect x="52" y="88" width="150" height="15" rx="7.5" fill="#A32D1E"/>
  <text x="127" y="99" font-size="8" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.08em" text-anchor="middle" fill="#F6E3DF">SPECIFIED · NOT BUILT</text>
  <text x="214" y="99" font-size="10" fill="#3F4742">F-20, FS-10 · spec derived-exo-3a1 · none of its six probes exist, and four await a model-check executor</text>

  <!-- the blind spot -->
  <text x="40" y="140" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#656E66">THE BLIND SPOT F-20 CLOSES</text>

  <rect x="40" y="152" width="180" height="44" rx="5" fill="#F6E3DF" stroke="#A32D1E" stroke-width="1.4"/>
  <text x="130" y="171" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1A1F1C">inputs</text>
  <text x="130" y="186" font-size="9.5" text-anchor="middle" fill="#3F4742">blocks, contributions, reads</text>

  <path d="M226 174 L258 174 M252 170 L258 174 L252 178" fill="none" stroke="#656E66" stroke-width="1.3"/>

  <rect x="264" y="152" width="140" height="44" rx="5" fill="#F7F8F5" stroke="#4B33C4" stroke-width="1.4"/>
  <text x="334" y="171" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1A1F1C">effect</text>
  <text x="334" y="186" font-size="9.5" text-anchor="middle" fill="#3F4742">what you review</text>

  <path d="M410 174 L442 174 M436 170 L442 174 L436 178" fill="none" stroke="#656E66" stroke-width="1.3"/>

  <rect x="448" y="152" width="160" height="44" rx="5" fill="#F7F8F5" stroke="#4B33C4" stroke-width="1.4"/>
  <text x="528" y="171" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1A1F1C">materialization</text>
  <text x="528" y="186" font-size="9.5" text-anchor="middle" fill="#3F4742">what gets signed</text>

  <path d="M614 174 L646 174 M640 170 L646 174 L640 178" fill="none" stroke="#656E66" stroke-width="1.3"/>

  <rect x="652" y="152" width="188" height="44" rx="5" fill="#DFEDE6" stroke="#1E6B52" stroke-width="1.4"/>
  <text x="746" y="171" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1A1F1C">signature</text>
  <text x="746" y="186" font-size="9.5" text-anchor="middle" fill="#3F4742">bound per F-5</text>

  <path d="M264 206 L264 216 L608 216 L608 206" fill="none" stroke="#1E6B52" stroke-width="1.3"/>
  <text x="436" y="232" font-size="10.5" text-anchor="middle" fill="#1E6B52">● F-4 / FS-6 re-derives and refuses on mismatch — proves these two agree</text>

  <path d="M40 206 L40 216 L220 216 L220 206" fill="none" stroke="#A32D1E" stroke-width="1.3"/>
  <text x="136" y="232" font-size="10.5" text-anchor="middle" font-weight="600" fill="#A32D1E">○ nothing asked where these came from</text>

  <text x="40" y="256" font-size="11" fill="#3F4742">A plugin block built on a value read from an untrusted RPC re-derives perfectly. So the check passes, and you sign it.</text>

  <!-- the record -->
  <rect x="40" y="274" width="800" height="132" rx="6" fill="#F7F8F5" stroke="#4B33C4" stroke-width="1.4"/>
  <text x="56" y="296" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#4B33C4">F-20 — EVERY INPUT THAT REACHED THE SIGNED BYTES CARRIES ITS ORIGIN</text>

  <rect x="56" y="308" width="186" height="34" rx="4" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1"/>
  <text x="149" y="323" font-size="10.5" text-anchor="middle" fill="#1A1F1C">plugin block</text>
  <text x="149" y="336" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" text-anchor="middle" fill="#656E66">F-12</text>

  <rect x="250" y="308" width="186" height="34" rx="4" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1"/>
  <text x="343" y="323" font-size="10.5" text-anchor="middle" fill="#1A1F1C">driver contribution</text>
  <text x="343" y="336" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" text-anchor="middle" fill="#656E66">F-6</text>

  <rect x="444" y="308" width="186" height="34" rx="4" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1"/>
  <text x="537" y="323" font-size="10.5" text-anchor="middle" fill="#1A1F1C">external read</text>
  <text x="537" y="336" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" text-anchor="middle" fill="#656E66">FS-1 · untrusted</text>

  <rect x="638" y="308" width="186" height="34" rx="4" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1"/>
  <text x="731" y="323" font-size="10.5" text-anchor="middle" fill="#1A1F1C">peer message</text>
  <text x="731" y="336" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" text-anchor="middle" fill="#656E66">F-1</text>

  <rect x="56" y="352" width="768" height="28" rx="4" fill="#E4E6E0" stroke="#C6CBC3" stroke-width="1"/>
  <text x="68" y="370" font-size="10.5" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">record entry  =  { class · log position }</text>
  <text x="330" y="370" font-size="10.5" fill="#3F4742">Positions, not copied values. The record is a reduction over the log, never a store beside it.</text>

  <text x="56" y="396" font-size="10.5" fill="#3F4742">The signed bytes change when any entry changes, so provenance is committed to rather than carried alongside.</text>

  <!-- the refusal -->
  <rect x="40" y="420" width="800" height="42" rx="6" fill="#F6E3DF" stroke="#A32D1E" stroke-width="1.4"/>
  <text x="56" y="438" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#A32D1E">THE TEETH</text>
  <text x="56" y="455" font-size="11.5" font-weight="600" fill="#1A1F1C">An input whose origin cannot be accounted for is a refusal to sign, not a gap in the record. Not disableable (FS-10).</text>

  <!-- the two boundaries -->
  <text x="40" y="492" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#656E66">WHO THE RECORD KEEPS THINGS FROM</text>

  <rect x="40" y="504" width="392" height="112" rx="6" fill="#F7F8F5" stroke="#1E6B52" stroke-width="1.3"/>
  <text x="56" y="524" font-size="10" font-weight="600" fill="#1E6B52">Inside the room — not from participants</text>
  <text x="56" y="542" font-size="10.5" fill="#3F4742">A participant can disclose anything they hold. The record</text>
  <text x="56" y="556" font-size="10.5" fill="#3F4742">does not pretend otherwise. Whether it names an account</text>
  <text x="56" y="570" font-size="10.5" fill="#3F4742">is driver-described (F-6):</text>
  <text x="56" y="590" font-size="10" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">◑ anonymous model</text>
  <text x="196" y="590" font-size="10" fill="#3F4742">record stays silent (FS-7)</text>
  <text x="56" y="606" font-size="10" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">● named model</text>
  <text x="196" y="606" font-size="10" fill="#3F4742">names who actually contributed</text>

  <rect x="448" y="504" width="392" height="112" rx="6" fill="#23282A"/>
  <text x="464" y="524" font-size="10" font-weight="600" fill="#8FA3F5">Outside the room — this is what FS-10 defends</text>
  <text x="464" y="542" font-size="10.5" fill="#DCE2DE">The record is scoped to the membership epoch (F-16) of</text>
  <text x="464" y="556" font-size="10.5" fill="#DCE2DE">the entries it describes.</text>
  <text x="464" y="576" font-size="10" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#8FA3F5">○ no epoch keys</text>
  <text x="604" y="576" font-size="10" fill="#DCE2DE">no lineage, at all</text>
  <text x="464" y="592" font-size="10" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#8FA3F5">○ joined at E+1</text>
  <text x="604" y="592" font-size="10" fill="#DCE2DE">cannot rebuild epoch E</text>
  <text x="464" y="610" font-size="9.5" fill="#96A19B">A file written in the clear replays identically and leaks all of it.</text>
</svg>
