<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 536" width="880" height="536" font-family="'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>How to write a driver — the contract and its conformance suite</title>
  <desc>A driver is one type behind the Driver seam implementing three methods: describe (its coordination policy — rounds, serialization domain, membership, finality, threshold), canonicalize (the effect to the exact bytes owners sign), and verifyContribution (is a contribution valid this round). The driver-generic core routes opaque contributions purely off describe() and never reads their bytes (invariant 6), and the re-derive-or-refuse check calls canonicalize (invariant 1). A conformance suite grades any driver on the properties the core relies on — describe stable, canonicalize deterministic, re-derive-or-refuse honest, verifyContribution pure, the collection converges — and both drivers that exist (stub, Safe) pass it. Adding a driver is: implement the three methods, pass conformance, register — no core change.</desc>
<!-- provenance
     serves:   BOTH
     shows:    The Driver contract (describe/canonicalize/verifyContribution), the
               driver-generic core it plugs into, the conformance suite that grades any
               driver (stub + Safe pass), and the recipe for adding a new driver without
               touching the core.
     sources:  docs/01-furps.md
               docs/02-implementation-plan.md
               CLAUDE.md
     evidence: [from-source] invariant 6 (driver-described
                   rounds/domain/membership/finality; the core never reads contribution
                   bytes) and invariant 1 (re-derive-or-refuse)
               [measured] src/drivers/conformance.nim grades a driver on those
                   properties; tests/conformance_test passes it against stub and Safe (6/6
                   each)
               [from-source] F-6/F-7 name the axes; the plan lists FROST threshold + a
                   describe-only LEZ driver at P6
     recheck:  Re-check when a third driver is added or a new conformance check is added
               to src/drivers/conformance.nim.
-->

  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A928C"/>
    </marker>
  </defs>

  <rect width="880" height="536" fill="#E4E6E0"/>

  <text x="40" y="42" font-size="19" font-weight="600" fill="#1A1F1C" letter-spacing="-0.3">How to write a driver</text>
  <text x="40" y="64" font-size="13.5" fill="#656E66">One type, three methods, behind the seam. Pass conformance, register — the core never changes (invariant 6).</text>

  <rect x="40" y="80" width="800" height="30" rx="5" fill="#DFEDE6" stroke="#1E6B52" stroke-width="1.2"/>
  <rect x="52" y="88" width="84" height="15" rx="7.5" fill="#1E6B52"/>
  <text x="94" y="99" font-size="8" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.08em" text-anchor="middle" fill="#DFEDE6">BUILT · INV 6</text>
  <text x="148" y="99" font-size="10" fill="#2A4A3C">A driver is a complete unit — its coordination AND its materialization live behind one interface</text>

  <!-- ══ the contract ══ -->
  <rect x="40" y="128" width="470" height="150" rx="6" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1.4"/>
  <text x="56" y="150" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#4B33C4">THE CONTRACT — THREE METHODS ON Driver</text>
  <text x="56" y="174" font-size="11.5" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" fill="#1A1F1C">describe()</text>
  <text x="56" y="190" font-size="10" fill="#3F4742">the coordination policy: rounds · domain · membership · finality · threshold</text>
  <text x="56" y="214" font-size="11.5" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" fill="#1A1F1C">canonicalize(effect)</text>
  <text x="56" y="230" font-size="10" fill="#3F4742">the effect → the exact bytes owners sign (Safe: the EIP-712 safeTxHash)</text>
  <text x="56" y="254" font-size="11.5" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" fill="#1A1F1C">verifyContribution(c, round)</text>
  <text x="56" y="270" font-size="10" fill="#3F4742">is this contribution valid? — the ONLY place bytes are read</text>

  <!-- ══ the generic core ══ -->
  <rect x="526" y="128" width="314" height="150" rx="6" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1.2"/>
  <text x="542" y="150" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#656E66">THE CORE — DRIVER-GENERIC</text>
  <text x="542" y="174" font-size="10.5" fill="#3F4742">Routes opaque contributions purely</text>
  <text x="542" y="188" font-size="10.5" fill="#3F4742">off describe() — never reads their</text>
  <text x="542" y="202" font-size="10.5" fill="#3F4742">bytes (inv 6). Rounds and threshold</text>
  <text x="542" y="216" font-size="10.5" fill="#3F4742">are the descriptor's, not constants.</text>
  <text x="542" y="240" font-size="10.5" fill="#3F4742">Before signing it re-derives via</text>
  <text x="542" y="254" font-size="10.5" fill="#3F4742">canonicalize and refuses on any</text>
  <text x="542" y="268" font-size="10.5" fill="#1A1F1C" font-weight="600">mismatch (inv 1) — cannot be disabled.</text>

  <!-- ══ the standard ══ -->
  <rect x="40" y="292" width="470" height="150" rx="6" fill="#DFEDE6" stroke="#1E6B52" stroke-width="1.2"/>
  <text x="56" y="314" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#1E6B52">THE STANDARD — checkConformance()</text>
  <text x="56" y="336" font-size="10.5" fill="#2A4A3C">describe() is stable · canonicalize is deterministic (inv 5)</text>
  <text x="56" y="354" font-size="10.5" fill="#2A4A3C">re-derive accepts a faithful materialization, refuses a</text>
  <text x="56" y="368" font-size="10.5" fill="#2A4A3C">tampered one (inv 1) · verifyContribution is pure (inv 6)</text>
  <text x="56" y="386" font-size="10.5" fill="#2A4A3C">· the collection converges at the declared threshold</text>
  <text x="56" y="412" font-size="11" fill="#1A1F1C"><tspan font-weight="600" fill="#1E6B52">stub ✓</tspan>   <tspan font-weight="600" fill="#1E6B52">Safe ✓</tspan>   <tspan fill="#656E66" font-family="'DM Mono',ui-monospace,Menlo,monospace">your driver → ?</tspan></text>
  <text x="56" y="430" font-size="9.5" fill="#656E66">Never merge with it red (the working agreement).</text>

  <!-- ══ to add a driver ══ -->
  <rect x="526" y="292" width="314" height="150" rx="6" fill="#23282A"/>
  <text x="542" y="314" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#96A19B">TO ADD A DRIVER</text>
  <text x="542" y="338" font-size="11" fill="#DCE2DE">1. implement the three methods</text>
  <text x="542" y="360" font-size="11" fill="#DCE2DE">2. pass checkConformance()</text>
  <text x="542" y="382" font-size="11" fill="#DCE2DE">3. register it (select by config)</text>
  <text x="542" y="410" font-size="10.5" fill="#8FE3B0" font-weight="600">No core change — that is what</text>
  <text x="542" y="424" font-size="10.5" fill="#8FE3B0" font-weight="600">invariant 6 promises.</text>

  <text x="40" y="466" font-size="11" font-weight="600" fill="#1A1F1C">Built today: the stub (conformance) and the Safe driver (EIP-712, 2-of-3, on-chain execTransaction).</text>
  <text x="40" y="484" font-size="10.5" fill="#3F4742">The contract invites more without touching the core: a FROST threshold driver (r=2 — the round model's real test), and a</text>
  <text x="40" y="498" font-size="10.5" fill="#3F4742">describe-only LEZ/zone driver to pressure-test membership-as-predicate against private execution (both P6 in the plan).</text>
  <text x="40" y="522" font-size="10.5" fill="#656E66" font-style="italic">The one gap left: a registry so the module selects a driver by config instead of hardcoding newSafeDriver.</text>
</svg>
