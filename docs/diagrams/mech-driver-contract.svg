<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 598" width="880" height="598" font-family="'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>How to write a driver — the contract and its conformance suite</title>
  <desc>A driver is one type behind the Driver seam implementing three methods — describe (its coordination policy: rounds, serialization domain, finality, threshold), canonicalize (the effect to the exact bytes owners sign), and verifyContribution (is a contribution valid this round) — and declaring two things: its action manifest (what it needs, touches and discloses) and its family profile (which kind of multisig it is). Both default to UNDECLARED, which fails conformance. The driver-generic core routes opaque contributions purely off describe() and never reads their bytes (invariant 6), and the re-derive-or-refuse check calls canonicalize (invariant 1). A conformance suite grades any driver on the properties the core relies on — describe stable, canonicalize deterministic, re-derive-or-refuse honest, verifyContribution pure, the collection converges, the manifest and profile declared and consistent — and the stub, Safe, threshold, frost, invoke, eip191, Bitcoin and LEZ multisig drivers pass it, with every registry kind's profile checked. Adding a driver is: implement the three methods, declare the manifest and profile, pass conformance, register — no core change.</desc>
<!-- provenance
     serves:   BOTH
     shows:    The Driver contract (describe/canonicalize/verifyContribution plus a
               declared manifest and profile), the driver-generic core it plugs into, the
               conformance suite that grades any driver, and the recipe for adding a new
               driver without touching the core.
     sources:  docs/01-furps.md
               docs/02-implementation-plan.md
               CLAUDE.md
               module/src/drivers/conformance.nim
               module/src/drivers/manifest.nim
               module/src/drivers/profile.nim
               module/tests/conformance_test.nim
               module/tests/profile_test.nim
     evidence: [from-source] invariant 6 (driver-described
                   rounds/domain/finality/threshold; the core never reads contribution bytes)
                   and invariant 1 (re-derive-or-refuse); membership left describe() with
                   ADR-015
               [from-source] conformance.nim grades describe, canonicalize, re-derive-or-
                   refuse, verifyContribution, convergence and the manifest
                   (checkConformance) plus the profile (checkProfileConformance);
                   conformance_test runs it on stub, Safe, threshold, frost, invoke and
                   eip191, btc_driver_test and lez_multisig_driver_test on the Bitcoin and
                   LEZ multisig drivers, and profile_test checks every kind's profile. Read
                   from the tests, not run for this figure
               [from-source] F-6/F-7 name the axes; FROST (frost, btc-frost, lez-frost),
                   Bitcoin P2WSH/tapscript and the LEZ multisig program are registered in
                   drivers/registry.nim, and a new kind is also named once in
                   drivers/kinds.nim
     recheck:  When a driver kind is added, or a check is added to
               src/drivers/conformance.nim.
-->

  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A928C"/>
    </marker>
  </defs>

  <rect width="880" height="598" fill="#E4E6E0"/>

  <text x="40" y="42" font-size="19" font-weight="600" fill="#1A1F1C" letter-spacing="-0.3">How to write a driver</text>
  <text x="40" y="64" font-size="13.5" fill="#656E66">Three methods and two declarations behind one seam. Pass conformance, register — the core never changes (inv 6).</text>

  <rect x="40" y="80" width="800" height="30" rx="5" fill="#DFEDE6" stroke="#1E6B52" stroke-width="1.2"/>
  <rect x="52" y="88" width="84" height="15" rx="7.5" fill="#1E6B52"/>
  <text x="94" y="99" font-size="8" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.08em" text-anchor="middle" fill="#DFEDE6">BUILT · INV 6</text>
  <text x="148" y="99" font-size="10" fill="#2A4A3C">A driver is a complete unit — its coordination AND its materialization live behind one interface</text>

  <!-- ══ the contract ══ -->
  <rect x="40" y="128" width="470" height="190" rx="6" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1.4"/>
  <text x="56" y="150" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#4B33C4">THE CONTRACT — THREE METHODS ON Driver, TWO DECLARATIONS</text>
  <text x="56" y="174" font-size="11.5" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" fill="#1A1F1C">describe()</text>
  <text x="56" y="190" font-size="10" fill="#3F4742">the coordination policy: rounds · domain · finality · threshold</text>
  <text x="56" y="214" font-size="11.5" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" fill="#1A1F1C">canonicalize(effect)</text>
  <text x="56" y="230" font-size="10" fill="#3F4742">the effect → the exact bytes owners sign (Safe: the EIP-712 safeTxHash)</text>
  <text x="56" y="254" font-size="11.5" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" fill="#1A1F1C">verifyContribution(c, round)</text>
  <text x="56" y="270" font-size="10" fill="#3F4742">is this contribution valid? — the ONLY place bytes are read</text>
  <text x="56" y="294" font-size="11.5" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" fill="#1A1F1C">manifest(effect) · profile()</text>
  <text x="56" y="310" font-size="10" fill="#3F4742">what it needs, touches, discloses · its family — both default to UNDECLARED</text>

  <!-- ══ the generic core ══ -->
  <rect x="526" y="128" width="314" height="190" rx="6" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1.2"/>
  <text x="542" y="150" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#656E66">THE CORE — DRIVER-GENERIC</text>
  <text x="542" y="174" font-size="10.5" fill="#3F4742">Routes opaque contributions purely</text>
  <text x="542" y="188" font-size="10.5" fill="#3F4742">off describe() — never reads their</text>
  <text x="542" y="202" font-size="10.5" fill="#3F4742">bytes (inv 6). Rounds and threshold</text>
  <text x="542" y="216" font-size="10.5" fill="#3F4742">are the descriptor's, not constants.</text>
  <text x="542" y="240" font-size="10.5" fill="#3F4742">Before signing it re-derives via</text>
  <text x="542" y="254" font-size="10.5" fill="#3F4742">canonicalize and refuses on any</text>
  <text x="542" y="268" font-size="10.5" fill="#1A1F1C" font-weight="600">mismatch (inv 1) — cannot be disabled.</text>

  <!-- ══ the standard ══ -->
  <rect x="40" y="332" width="470" height="172" rx="6" fill="#DFEDE6" stroke="#1E6B52" stroke-width="1.2"/>
  <text x="56" y="354" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#1E6B52">THE STANDARD — checkConformance() + checkProfileConformance()</text>
  <text x="56" y="376" font-size="10.5" fill="#2A4A3C">describe() is stable · canonicalize is deterministic (inv 5)</text>
  <text x="56" y="394" font-size="10.5" fill="#2A4A3C">re-derive accepts a faithful materialization, refuses a</text>
  <text x="56" y="408" font-size="10.5" fill="#2A4A3C">tampered one (inv 1) · verifyContribution is pure (inv 6)</text>
  <text x="56" y="426" font-size="10.5" fill="#2A4A3C">· the collection converges at the declared threshold</text>
  <text x="56" y="442" font-size="10.5" fill="#2A4A3C">· the manifest and the profile are declared and consistent</text>
  <text x="56" y="464" font-size="11" fill="#1A1F1C"><tspan font-weight="600" fill="#1E6B52">stub ✓</tspan>  <tspan font-weight="600" fill="#1E6B52">Safe ✓</tspan>  <tspan font-weight="600" fill="#1E6B52">threshold ✓</tspan>  <tspan font-weight="600" fill="#1E6B52">frost ✓</tspan>  <tspan font-weight="600" fill="#1E6B52">invoke ✓</tspan>  <tspan font-weight="600" fill="#1E6B52">eip191 ✓</tspan></text>
  <text x="56" y="480" font-size="11" fill="#1A1F1C"><tspan font-weight="600" fill="#1E6B52">btc ✓</tspan>  <tspan font-weight="600" fill="#1E6B52">lez-multisig ✓</tspan>  <tspan fill="#2A4A3C">· every kind's profile ✓</tspan>  <tspan fill="#656E66" font-family="'DM Mono',ui-monospace,Menlo,monospace">yours → ?</tspan></text>
  <text x="56" y="496" font-size="9.5" fill="#656E66">Never merge with it red (the working agreement).</text>

  <!-- ══ to add a driver ══ -->
  <rect x="526" y="332" width="314" height="172" rx="6" fill="#23282A"/>
  <text x="542" y="354" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#96A19B">TO ADD A DRIVER</text>
  <text x="542" y="378" font-size="11" fill="#DCE2DE">1. implement the three methods</text>
  <text x="542" y="400" font-size="11" fill="#DCE2DE">2. declare its manifest and profile</text>
  <text x="542" y="422" font-size="11" fill="#DCE2DE">3. pass checkConformance()</text>
  <text x="542" y="444" font-size="11" fill="#DCE2DE">4. register it: kinds.nim + a registry arm</text>
  <text x="542" y="472" font-size="10.5" fill="#8FE3B0" font-weight="600">No core change — that is what</text>
  <text x="542" y="486" font-size="10.5" fill="#8FE3B0" font-weight="600">invariant 6 promises.</text>

  <text x="40" y="528" font-size="11" font-weight="600" fill="#1A1F1C">The first three: the stub, the Safe driver (EIP-712, 2-of-3, on-chain), and a threshold driver (Ed25519 k-of-n) — nothing</text>
  <text x="40" y="546" font-size="10.5" fill="#3F4742">like Safe, yet it folds the same intent to executable through the same reduceIntents. That is the genericity, demonstrated —</text>
  <text x="40" y="560" font-size="10.5" fill="#3F4742">not just typed. FROST (frost, btc-frost, lez-frost), Bitcoin P2WSH and tapscript, and the LEZ multisig program have since slotted in.</text>
  <text x="40" y="584" font-size="10.5" fill="#1E6B52" font-weight="600">Turnkey now: newDriver(kind, config) selects by config, and the multi-party fold is driver-generic — a non-Safe driver runs end to end.</text>
</svg>
