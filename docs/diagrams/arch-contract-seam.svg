<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" font-family="'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>What is generated, and what is written by hand</title>
  <desc>Two codegen paths — muster.lidl through the lidl_c.h JSON bridge to a Nim surface, and metadata.json plus a .rep file through logos-module-builder to plugin and QtRO glue — each ending in a small hand-written region. The Nim backend does not exist yet.</desc>
<!-- provenance
     serves:   BOTH
     shows:    The two codegen paths and the hand-written region each ends in:
               muster.lidl through the lidl_c.h JSON bridge to a generated Nim surface,
               and metadata.json plus a .rep through logos-module-builder to the plugin
               entry point and QtRO glue.
     sources:  docs/02-implementation-plan.md
               CLAUDE.md
               demo/muster-ui/metadata.json
               demo/muster-ui/CMakeLists.txt
     evidence: [from-source] The four lidl_c.h functions, the two rules the header states
                   outright, and the codegen keys — read off the header and metadata.json
               [from-source] The Nim codegen backend is marked as not existing, because
                   it does not: it is the P0 spike, and ADR-008's fallback is printed beside
                   it
               [illustrative] The ~106-line figure for the Rust FFI binding is the plan's
                   characterisation of logos-rust-sdk/lidl-gen, not a line count taken here
     recheck:  At P0. The moment the Nim backend exists the dashed box stops being
               dashed, and if the fallback is taken instead the left column loses a step.
-->

  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A928C"/>
    </marker>
  </defs>

  <rect width="880" height="640" fill="#E4E6E0"/>

  <text x="40" y="40" font-size="19" font-weight="600" fill="#1A1F1C" letter-spacing="-0.3">What is generated, and what is written</text>
  <text x="40" y="62" font-size="13.5" fill="#656E66">Two codegen paths. The hand-written region is small, and bounded on both sides by a contract.</text>

  <text x="40" y="86" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#656E66">THE MODULE — muster-module.lgx</text>
  <text x="460" y="86" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#656E66">THE VIEW — muster-ui.lgx</text>

  <!-- ══════════ LEFT: the module contract ══════════ -->
  <rect x="40" y="96" width="380" height="48" rx="4" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1.4"/>
  <text x="54" y="116" font-size="12" font-weight="600" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">muster.lidl</text>
  <text x="54" y="132" font-size="9.5" fill="#656E66">Hand-written, normative, and the only outward seam.</text>

  <path d="M 230 144 L 230 162" stroke="#8A928C" stroke-width="1.2" fill="none" marker-end="url(#s)"/>

  <rect x="40" y="164" width="380" height="58" rx="4" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="54" y="182" font-size="11" font-weight="600" fill="#1A1F1C">lidl_c.h — the JSON bridge</text>
  <text x="54" y="198" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#656E66">lidl_parse_to_json · lidl_serialize_from_json</text>
  <text x="54" y="212" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#656E66">lidl_validate_json · lidl_free_string</text>

  <path d="M 230 222 L 230 240" stroke="#8A928C" stroke-width="1.2" fill="none" marker-end="url(#s)"/>

  <rect x="40" y="242" width="380" height="76" rx="4" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="54" y="260" font-size="11" font-weight="600" fill="#1A1F1C">A Nim codegen backend</text>
  <text x="54" y="276" font-size="9.5" fill="#A32D1E" font-weight="600">Ours to write. It does not exist yet — this is the P0 spike.</text>
  <text x="54" y="292" font-size="9.5" fill="#656E66">logos-rust-sdk/lidl-gen is the worked example: ~106 lines of FFI,</text>
  <text x="54" y="303" font-size="9.5" fill="#656E66">the rest language-specific emission.</text>

  <path d="M 230 318 L 230 336" stroke="#8A928C" stroke-width="1.2" fill="none" marker-end="url(#s)"/>

  <rect x="40" y="338" width="380" height="42" rx="4" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="54" y="356" font-size="8.5" font-family="'DM Mono',ui-monospace,Menlo,monospace" letter-spacing="0.08em" fill="#656E66">GENERATED</text>
  <text x="54" y="372" font-size="11" fill="#1A1F1C">The Nim surface — every method, event and record type</text>

  <path d="M 230 380 L 230 398" stroke="#8A928C" stroke-width="1.2" fill="none" marker-end="url(#s)"/>

  <rect x="40" y="400" width="380" height="58" rx="4" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1.4"/>
  <text x="54" y="420" font-size="12" font-weight="600" fill="#1A1F1C">The Nim core</text>
  <text x="54" y="436" font-size="9.5" fill="#656E66">dcbor · crypto · log · intents · drivers · transport · plugins.</text>
  <text x="54" y="450" font-size="9.5" fill="#656E66">Everything the invariants are about, behind the generated surface.</text>

  <!-- ══════════ RIGHT: the view module ══════════ -->
  <rect x="460" y="96" width="380" height="58" rx="4" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1.4"/>
  <text x="474" y="116" font-size="12" font-weight="600" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#1A1F1C">metadata.json + ChatBackend.rep</text>
  <text x="474" y="132" font-size="9.5" fill="#656E66">Hand-written. The codegen keys name the rep, the backend class</text>
  <text x="474" y="146" font-size="9.5" fill="#656E66">and its header; the rep declares the C++/QML boundary.</text>

  <path d="M 650 154 L 650 172" stroke="#8A928C" stroke-width="1.2" fill="none" marker-end="url(#s)"/>

  <rect x="460" y="174" width="380" height="52" rx="4" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="474" y="192" font-size="11" font-weight="600" fill="#1A1F1C">logos-module-builder</text>
  <text x="474" y="208" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" fill="#656E66">mkLogosQmlModule · logos_module() · mkExternalLib</text>
  <text x="474" y="220" font-size="9.5" fill="#656E66">One metadata.json drives the whole build.</text>

  <path d="M 650 226 L 650 244" stroke="#8A928C" stroke-width="1.2" fill="none" marker-end="url(#s)"/>

  <rect x="460" y="246" width="380" height="58" rx="4" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="474" y="264" font-size="8.5" font-family="'DM Mono',ui-monospace,Menlo,monospace" letter-spacing="0.08em" fill="#656E66">GENERATED</text>
  <text x="474" y="280" font-size="11" fill="#1A1F1C">The plugin entry point, and the QtRO glue —</text>
  <text x="474" y="295" font-size="11" fill="#1A1F1C">source on the module side, replica on the view's.</text>

  <path d="M 650 304 L 650 322" stroke="#8A928C" stroke-width="1.2" fill="none" marker-end="url(#s)"/>

  <rect x="460" y="324" width="380" height="120" rx="4" fill="#EAE6FA" stroke="#4B33C4" stroke-width="1.4"/>
  <text x="474" y="344" font-size="12" font-weight="600" fill="#1A1F1C">The backend and the view</text>
  <text x="474" y="362" font-size="9.5" fill="#656E66">ChatBackend, three list models, and the ChatUi QML module.</text>
  <text x="474" y="382" font-size="9.5" fill="#1A1F1C" font-weight="600">In the specified client this is where the split lands:</text>
  <text x="474" y="398" font-size="9.5" fill="#656E66">the view reaches the module only through the logos API under</text>
  <text x="474" y="412" font-size="9.5" fill="#656E66">capability policy, and the module imports nothing from the UI.</text>
  <text x="474" y="432" font-size="9.5" fill="#656E66">Inter-module calls go through logos-core, never a side channel.</text>

  <!-- ══════════ THE RULES ══════════ -->
  <rect x="40" y="470" width="800" height="140" rx="8" fill="#F7F8F5" stroke="#C6CBC3" stroke-width="1"/>
  <text x="56" y="492" font-size="9" font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="600" letter-spacing="0.1em" fill="#656E66">TWO RULES THE C HEADER STATES OUTRIGHT, AND ONE FALLBACK</text>

  <text x="56" y="516" font-size="10.5" fill="#1A1F1C" font-weight="600">Free every returned string with <tspan font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="400">lidl_free_string</tspan>. <tspan font-weight="400" fill="#656E66">The bridge hands back malloc'd JSON; nothing else will release it.</tspan></text>

  <text x="56" y="542" font-size="10.5" fill="#1A1F1C" font-weight="600">Read optionality from the derived <tspan font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="400">isOptional</tspan> / <tspan font-family="'DM Mono',ui-monospace,Menlo,monospace" font-weight="400">valueType</tspan> keys — never the raw spelling.</text>
  <text x="56" y="557" font-size="10" fill="#656E66">The raw <tspan font-family="'DM Mono',ui-monospace,Menlo,monospace">optional</tspan> / <tspan font-family="'DM Mono',ui-monospace,Menlo,monospace">type</tspan> fields exist only so the wire form round-trips. Reading them is a bug that type-checks.</text>

  <text x="56" y="583" font-size="10.5" fill="#1A1F1C" font-weight="600">If the Nim backend stalls (ADR-008): <tspan font-weight="400" fill="#656E66">hand-write the generated surface for this one contract and keep going.</tspan></text>
  <text x="56" y="598" font-size="10" fill="#656E66"><tspan font-family="'DM Mono',ui-monospace,Menlo,monospace">muster.lidl</tspan> stays normative either way — which is the whole reason the contract comes first.</text>
</svg>
