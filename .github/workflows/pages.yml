# Publish docs/diagrams/ — plus the multisig family atlas at /atlas/, and nothing
# else — as the Pages site.
#
# The interactive substrates need a page that permits <script>, which forum
# software does not (docs/diagrams/README.md §3.2). Posts embed the exported
# static frame and link out to the live version here.
#
# The artifact is assembled, not docs/ wholesale: the specification documents are
# already public in the repository, and rendering them as a website is a separate
# decision from serving the diagrams. The one deliberate widening (2026-09-27) is
# the atlas, docs/design/multisig-atlas.html, served at /atlas/ so it can be shared
# by link: a self-contained page, like the substrates. Add any other page here the
# same way — by name — or not at all.
#
# No build step. The substrates are self-contained single files and the figures
# are plain SVG, so this uploads the directory as it stands. That is the same
# property that makes a substrate openable straight from a checkout.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/diagrams/**'
      - 'docs/design/multisig-atlas.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in progress: a half-published site is worse than a
# slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The index is generated from manifest.json, so a figure that was added
      # without a manifest entry cannot reach the site — the same gate the
      # pre-commit hook applies locally, enforced again at publish time.
      - name: Check the manifest, and rebuild the index from it
        run: |
          python3 docs/diagrams/tools/check-manifest.py
          python3 docs/diagrams/tools/make-index.py
          git diff --exit-code -- docs/diagrams/index.html \
            || { echo "::error::index.html is stale — run tools/make-index.py and commit it"; exit 1; }

      # The atlas embeds contracts/families/registry.json; publish it only when that
      # copy is current (the same gate the pre-commit hook applies).
      - name: Check the atlas's embedded registry
        run: python3 scripts/check-family-registry.py

      - name: Assemble the site
        run: |
          mkdir -p _site/atlas
          cp -r docs/diagrams/. _site/
          cp docs/design/multisig-atlas.html _site/atlas/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
