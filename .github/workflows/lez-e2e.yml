name: LEZ e2e

# RFP-005 S.5/S.6 (roadmap M3): lez-msig's end-to-end tests against a standalone LEZ sequencer.
# A local LEZ v0.3.0 zone (infra/lez/localnet.sh, dev-mode receipts), the program deployed from
# programs/lez-msig/artifacts/msig.bin, then: the program alone through its key-free operations
# (live_public), the private posture (live_private), and the room's flow (lez_msig_live_e2e).
# The second job, lez-msig-v04, does the same for the LEZ v0.4 port (programs/lez-msig/lez04) on a
# local LEZ v0.4.0-rc3 zone: live_public04, live_private04, live_exec04, and the room's private
# posture through msig_exec04 (lez_msig_private_e2e). Every proof is a dev-mode receipt.
# Real-proving runs are too slow for a hosted runner; they are BENCHMARKS.md's.

on:
  push:
    branches: [main]
    paths:
      - 'programs/lez-msig/**'
      - 'infra/lez/**'
      - 'module/src/drivers/lez_msig.nim'
      - 'module/src/lez/msig.nim'
      - 'module/src/settlement/**'
      - 'module/src/wallet/lez_msig_*.nim'
      - 'module/src/coordination/msig_*.nim'
      - 'module/tests/lez_msig_live_e2e.nim'
      - 'module/tests/lez_msig_private_e2e.nim'
      - '.github/workflows/lez-e2e.yml'
  pull_request:
    paths:
      - 'programs/lez-msig/**'
      - 'infra/lez/**'
      - 'module/src/drivers/lez_msig.nim'
      - 'module/src/lez/msig.nim'
      - 'module/src/settlement/**'
      - 'module/src/wallet/lez_msig_*.nim'
      - 'module/src/coordination/msig_*.nim'
      - 'module/tests/lez_msig_live_e2e.nim'
      - 'module/tests/lez_msig_private_e2e.nim'
      - '.github/workflows/lez-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lez-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # RFP-005 U.4 (exo-7610): the committed IDL is what SPEL generates from msig_core, and it
  # decodes Muster's State vector. SPEL is pinned in lez04/tools/idl.sh; its build is cached.
  lez-msig-idl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: logos-co/setup-nix-cache-action@781f072122f4df6af0e33a7d355ebd20283e019e # v1.2.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/muster/spel-*
          key: spel-${{ hashFiles('programs/lez-msig/lez04/tools/idl.sh') }}
      - name: risc0's recursion circuit (spel's LEZ dependencies build risc0, exo-ba5)
        run: |
          sum=744b999f0a35b3c86753311c7efb2a0054be21727095cf105af6ee7d3f4d8849
          zkr=/nix/store/2dd045zdaad44awdpscjw5fdw97bvpcb-$sum.zip
          if ! nix-store --realise "$zkr" >/dev/null; then
            zkr=$RUNNER_TEMP/$sum.zip
            curl -fsSL -o "$zkr" "https://github.com/corpetty/muster/releases/download/muster-v0.4.0/$sum.zip"
          fi
          echo "$sum  $zkr" | sha256sum -c
          echo "RECURSION_SRC_PATH=$zkr" >> "$GITHUB_ENV"
      - name: libpcsclite (spel's LEZ wallet links Keycard support)
        run: sudo apt-get install -y --no-install-recommends libpcsclite-dev
      - name: The IDL is SPEL's, and decodes a real State
        run: programs/lez-msig/lez04/tools/idl.sh --check

  lez-msig:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Free disk (LEZ, risc0 and the Nim closure need ~25 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: logos-co/setup-nix-cache-action@781f072122f4df6af0e33a7d355ebd20283e019e # v1.2.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/muster/lez-v0.3.0
            ~/.cache/muster/risc0
          key: lez-zone-v0.3.0-${{ hashFiles('infra/lez/localnet.sh') }}
          restore-keys: lez-zone-v0.3.0-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            programs/lez-msig/target
          key: lez-msig-host-${{ hashFiles('programs/lez-msig/Cargo.lock') }}
          restore-keys: lez-msig-host-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/muster/nimpkgs
          key: nimpkgs-${{ hashFiles('module/metadata.json') }}
          restore-keys: nimpkgs-
      - name: risc0's recursion circuit (its S3 bucket answers 403 since 2026-11-23, exo-ba5)
        # risc0-circuit-recursion's build.rs downloads this unless RECURSION_SRC_PATH names it.
        # The Logos nix cache holds it (the prover flakes' fixed-output fetch); else the copy on
        # muster-v0.4.0. The hash is the file's name and its sha256, checked either way.
        run: |
          sum=744b999f0a35b3c86753311c7efb2a0054be21727095cf105af6ee7d3f4d8849
          zkr=/nix/store/2dd045zdaad44awdpscjw5fdw97bvpcb-$sum.zip
          if ! nix-store --realise "$zkr" >/dev/null; then
            zkr=$RUNNER_TEMP/$sum.zip
            curl -fsSL -o "$zkr" "https://github.com/corpetty/muster/releases/download/muster-v0.4.0/$sum.zip"
          fi
          echo "$sum  $zkr" | sha256sum -c
          echo "RECURSION_SRC_PATH=$zkr" >> "$GITHUB_ENV"
      - name: r0vm 3.0.5 (genesis runs in risc0's executor)
        run: |
          mkdir -p ~/.cache/muster/risc0
          test -x ~/.cache/muster/risc0/bin/r0vm \
            || cargo install risc0-r0vm --version 3.0.5 --locked --root ~/.cache/muster/risc0
      - name: A local LEZ v0.3.0 zone, the program deployed
        run: |
          infra/lez/localnet.sh
          infra/lez/localnet.sh deploy programs/lez-msig/artifacts/msig.bin | tee "$RUNNER_TEMP/deploy.txt"
          prog=$(grep -o 'hex [0-9a-f]\{64\}' "$RUNNER_TEMP/deploy.txt" | cut -d' ' -f2)
          test -n "$prog"
          echo "PROGRAM=$prog" >> "$GITHUB_ENV"
      - name: The program alone, through its key-free operations (live_public)
        if: hashFiles('programs/lez-msig/host/tests/live_public.rs') != ''
        working-directory: programs/lez-msig
        env:
          MSIG_LIVE_RPC: http://127.0.0.1:3040
        run: MSIG_LIVE_PROGRAM=$PROGRAM cargo test -p msig_host --locked --test live_public -- --nocapture
      - name: The private posture, dev-mode receipts (live_private)
        working-directory: programs/lez-msig
        env:
          MSIG_LIVE_RPC: http://127.0.0.1:3040
          RISC0_DEV_MODE: "1"
        run: MSIG_LIVE_PROGRAM=$PROGRAM cargo test -p msig_host --locked --test live_private -- --nocapture
      - name: From a muster room (lez_msig_live_e2e)
        env:
          OUT: ${{ runner.temp }}/e2e
        run: MUSTER_LEZ_MSIG_PROGRAM=$PROGRAM module/tests/run-suite.sh e2e lez_msig_live
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lez-e2e-logs
          path: |
            ${{ runner.temp }}/e2e
            ~/.cache/muster/lez-v0.3.0/.muster-run/sequencer.log
          if-no-files-found: ignore

  lez-msig-v04:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      MUSTER_LEZ_VERSION: v0.4.0-rc3
      # LEE's test-utils (the host tests' dev-dependency) refuse a release build without debug
      # assertions; the executor's dev-mode runs want a release build (labbook lez-v04-port §13)
      CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Free disk (LEZ, risc0 and the Nim closure need ~25 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: logos-co/setup-nix-cache-action@781f072122f4df6af0e33a7d355ebd20283e019e # v1.2.0
      # The zone's clone and build, its own key: the cache keeps ~/.cache/muster/lez-<version> but
      # never /nix/store, and localnet.sh re-links the nix libraries a restore lost (exo-98e).
      # Restored here and saved as soon as each build is done, so a later failing step keeps them.
      - id: zone-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/muster/lez-v0.4.0-rc3
            ~/.cache/muster/risc0
          key: lez-zone-v0.4.0-rc3-${{ hashFiles('infra/lez/localnet.sh') }}
          restore-keys: lez-zone-v0.4.0-rc3-
      - id: host-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            programs/lez-msig/lez04/target
          key: lez-msig-host04-${{ hashFiles('programs/lez-msig/lez04/Cargo.lock') }}
          restore-keys: lez-msig-host04-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/muster/nimpkgs
          key: nimpkgs-${{ hashFiles('module/metadata.json') }}
          restore-keys: nimpkgs-
      - name: risc0's recursion circuit (its S3 bucket answers 403 since 2026-11-23, exo-ba5)
        run: |
          sum=744b999f0a35b3c86753311c7efb2a0054be21727095cf105af6ee7d3f4d8849
          zkr=/nix/store/2dd045zdaad44awdpscjw5fdw97bvpcb-$sum.zip
          if ! nix-store --realise "$zkr" >/dev/null; then
            zkr=$RUNNER_TEMP/$sum.zip
            curl -fsSL -o "$zkr" "https://github.com/corpetty/muster/releases/download/muster-v0.4.0/$sum.zip"
          fi
          echo "$sum  $zkr" | sha256sum -c
          echo "RECURSION_SRC_PATH=$zkr" >> "$GITHUB_ENV"
      - name: r0vm 3.0.5 (genesis runs in risc0's executor)
        run: |
          mkdir -p ~/.cache/muster/risc0
          test -x ~/.cache/muster/risc0/bin/r0vm \
            || cargo install risc0-r0vm --version 3.0.5 --locked --root ~/.cache/muster/risc0
      - name: A local LEZ v0.4.0-rc3 zone, the program deployed
        run: |
          infra/lez/localnet.sh
          infra/lez/localnet.sh deploy programs/lez-msig/lez04/artifacts/msig.bin | tee "$RUNNER_TEMP/deploy.txt"
          prog=$(grep -o 'hex [0-9a-f]\{64\}' "$RUNNER_TEMP/deploy.txt" | cut -d' ' -f2)
          test -n "$prog"
          echo "PROGRAM=$prog" >> "$GITHUB_ENV"
      - if: steps.zone-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/muster/lez-v0.4.0-rc3
            ~/.cache/muster/risc0
          key: lez-zone-v0.4.0-rc3-${{ hashFiles('infra/lez/localnet.sh') }}
      - name: The host tests and msig_exec04, built once (release, debug assertions on)
        working-directory: programs/lez-msig/lez04
        # integration tests build the package's binaries with the tests' features, so this also
        # leaves target/release/msig_exec04 for lez_msig_private_e2e
        run: cargo test --release -p msig_host04 --locked --no-run
      - if: steps.host-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            programs/lez-msig/lez04/target
          key: lez-msig-host04-${{ hashFiles('programs/lez-msig/lez04/Cargo.lock') }}
      - name: The program alone, public posture (live_public04)
        working-directory: programs/lez-msig/lez04
        env:
          MSIG_LIVE_RPC: http://127.0.0.1:3040
        run: MSIG_LIVE_PROGRAM=$PROGRAM cargo test --release -p msig_host04 --locked --test live_public04 -- --nocapture
      - name: The private posture, dev-mode receipts (live_private04)
        working-directory: programs/lez-msig/lez04
        env:
          MSIG_LIVE_RPC: http://127.0.0.1:3040
          RISC0_DEV_MODE: "1"
        run: MSIG_LIVE_PROGRAM=$PROGRAM cargo test --release -p msig_host04 --locked --test live_private04 -- --nocapture
      - name: The executor's JSON surface, dev-mode receipts (live_exec04)
        working-directory: programs/lez-msig/lez04
        env:
          MSIG_LIVE_RPC: http://127.0.0.1:3040
          RISC0_DEV_MODE: "1"
        run: MSIG_LIVE_PROGRAM=$PROGRAM cargo test --release -p msig_host04 --locked --test live_exec04 -- --nocapture
      - name: From a muster room, the private posture (lez_msig_private_e2e)
        env:
          OUT: ${{ runner.temp }}/e2e
          RISC0_DEV_MODE: "1"
        run: |
          test -x programs/lez-msig/lez04/target/release/msig_exec04
          MUSTER_LEZ_MSIG_PROGRAM=$PROGRAM module/tests/run-suite.sh e2e lez_msig_private
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lez-e2e-v04-logs
          path: |
            ${{ runner.temp }}/e2e
            ~/.cache/muster/lez-v0.4.0-rc3/.muster-run/sequencer.log
          if-no-files-found: ignore
