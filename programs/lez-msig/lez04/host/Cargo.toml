[package]
name = "msig_host04"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The lez-msig client on LEZ v0.4: the multisig's account at its placement and its public transactions; the tests on LEE's own state."

[dependencies]
msig_core = { workspace = true, features = ["signing"] }
msig_v04.workspace = true
msig_methods04 = { path = "../methods" }
lee.workspace = true
lee_core = { workspace = true, features = ["host"] }
borsh.workspace = true
hex = "0.4"

[dev-dependencies]
lee = { workspace = true, features = ["test-utils"] }
rand = "0.8"
