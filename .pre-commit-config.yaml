repos:
- repo: local
  hooks:
  - id: claude-md-coverage
    name: New source directory carries its CLAUDE.md
    entry: exophial-check-claude-md
    language: system
    pass_filenames: false
    require_serial: true
    always_run: true
- repo: local
  hooks:
  - id: red-before-green-pre-push
    name: Newly-added tests fail before their fix (red-before-green)
    entry: exophial-red-before-green
    language: system
    pass_filenames: false
    always_run: true
    verbose: true
    stages:
    - pre-push
- repo: local
  hooks:
  - id: tdd-trailer
    name: 'Commit message carries a Tested-Behavior: or TDD-Exempt: trailer'
    entry: scripts/git-hooks/tdd-trailer.sh
    language: script
    stages:
    - commit-msg
- repo: local
  hooks:
  - id: check-subtree-edits
    name: Subtree-path edits carry a git-subtree-dir trailer
    entry: exophial-check-subtree-edits
    language: system
    stages:
    - commit-msg
- repo: local
  hooks:
  - id: session-trailer
    name: Stamp every commit with the session that produced it
    entry: exophial-session-trailer
    language: system
    stages:
    - commit-msg
- repo: local
  hooks:
  - id: diagram-manifest
    name: Figures declare their sources and evidence grades
    entry: docs/diagrams/tools/check-manifest.py
    language: system
    pass_filenames: false
    files: ^docs/diagrams/
- repo: local
  hooks:
  - id: readme-rot
    name: Entry-point READMEs track the current phase
    entry: scripts/check-readme-rot.py
    language: system
    pass_filenames: false
    verbose: true
    files: ^(README\.md|module/README\.md|CLAUDE\.md)$
- repo: local
  hooks:
  - id: claims-registry
    name: Walkthrough claims resolve to a requirement and a test (ADR-012)
    entry: scripts/check-claims-registry.py
    language: system
    pass_filenames: false
    verbose: true
    files: ^(contracts/claims/|docs/01-furps\.md|module/tests/|ui/tests/)
- repo: local
  hooks:
  - id: claims-qml-sync
    name: ClaimsRegistry.qml is regenerated from the claims registry
    entry: ui/tools/gen-claims-qml.py
    args: [--check]
    language: system
    pass_filenames: false
    files: ^(contracts/claims/|ui/src/qml/ClaimsRegistry\.qml|ui/tools/gen-claims-qml\.py)$
- repo: local
  hooks:
  - id: run-targets
    name: Run instructions resolve (make run / nix runner)
    entry: scripts/check-run-targets.py
    language: system
    pass_filenames: false
    verbose: true
    files: ^(Makefile|ui/flake\.nix|README\.md)$
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.6.0
  hooks:
  - id: trailing-whitespace
    args:
    - --markdown-linebreak-ext=md
  - id: end-of-file-fixer
  - id: check-yaml
    args:
    - --unsafe
  - id: check-added-large-files
    args:
    - --maxkb=1000
    exclude: (^|/)flake\.lock$
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: mixed-line-ending
    args:
    - --fix=lf
- repo: local
  hooks:
  - id: reroute-main-commit
    name: Refuse a direct commit on main; reroute it to a worker branch
    entry: exophial-reroute-main-commit
    language: system
    pass_filenames: false
    always_run: true
    stages:
    - pre-commit
