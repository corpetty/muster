status: completed
pebble_id: exo-526
summary: >
  Turned the muster_module return surface's readability from assumed into
  asserted. Traced the reported `logoscore --call ...health()` -> `Result: false`
  through the real host stack (logos-liblogos proxy_api.cpp `--call` ->
  LogosAPIClient::invokeRemoteMethod -> module_proxy.cpp -> the generated
  <Module>CdylibProvider::callMethod in logos-qt-sdk
  qt-generator/lidl_gen_cdylib_glue.cpp -> logos-cpp-sdk
  logos_json_convert.cpp nlohmannToQVariant) and confirmed the Nim core returns
  the JSON string "ok" and the codegen path marshals a JSON string to a typed
  QString correctly — the observed bool `false` was a host-side artifact
  (ad-hoc `-m` capability-token handshake / stale module), not a codegen drop.
  Authored the spec's acceptance oracle
  tests/probes/probe_return_marshalling_host.nim: it builds the module as a Nim
  staticlib (the exact shape codegen.nim.staticlib produces) and links it into a
  C++ host harness (tests/probes/host_return_harness.cpp) that reproduces the
  shipped dispatch -> nlohmann::json::parse -> nlohmannToQVariant -> CLI
  toString() marshalling and reads the value a CLIENT observes — going strictly
  beyond logos_module_dispatch, exercising the real Nim->C++ boundary with no
  module internals mocked. It emits one {"client_return_typed": ...} observation
  per call over health() plus propose()/status() across a valid/edge effect-JSON
  family; the spec's always(client_return_typed) requires every one to be a typed
  non-empty string (health()=="ok", propose()->non-empty id, status()->a known
  lifecycle token), never a bool/empty/default. Verified GREEN at the committed
  SHA (15 observations, all typed, exit 0) and verified DISCRIMINATING: mutating
  health's dispatch to return %false reproduces exactly the reported symptom
  (client_type "bool", client_value "false", client_return_typed false) and the
  probe fails loudly (AssertionDefect, non-zero exit); reverted before commit.
  Also documented the probe's g++/secp256k1 toolchain need in module/tests/README.md.
